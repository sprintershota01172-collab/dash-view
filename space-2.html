    <script>
      (function () {
        var ownMeta = document.querySelector('meta[name="build-id"]');
        var ownId = ownMeta ? ownMeta.getAttribute("content") : null;
        function checkForUpdate() {
          try {
            if (!ownId || !window.fetch) return;
            var base = location.href.split(/[?#]/)[0];
            fetch(base + "?check=" + Date.now(), { cache: "no-store" })
              .then(function (res) { return res.ok ? res.text() : null; })
              .then(function (html) {
                if (!html) return;
                var m = html.match(/<meta[^>]+name=["']build-id["'][^>]+content=["']([^"']+)["']/i) ||
                        html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']build-id["']/i);
                if (!m) return;
                var fetchedId = m[1];
                if (!fetchedId || fetchedId === ownId) return;
                var already = null;
                try { already = sessionStorage.getItem("reloaded-for"); } catch (e) {}
                if (already === fetchedId) return;
                try { sessionStorage.setItem("reloaded-for", fetchedId); } catch (e) {}
                location.replace(base + "?v=" + encodeURIComponent(fetchedId));
              })
              .catch(function () {});
          } catch (e) {}
        }
        checkForUpdate();
        window.addEventListener("pageshow", checkForUpdate);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") checkForUpdate();
        });
      })();
    </script>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          try {
            navigator.serviceWorker.register("sw.js").catch(function () {});
          } catch (e) {}
        });
        try {
          navigator.serviceWorker.addEventListener("message", function (event) {
            var data = event.data;
            var isUpdate = data === "update-available" ||
              (data && data.type === "update-available");
            if (!isUpdate) return;
            var done = null;
            try { done = sessionStorage.getItem("sw-update-reloaded"); } catch (e) {}
            if (done) return;
            try { sessionStorage.setItem("sw-update-reloaded", "1"); } catch (e) {}
            location.reload();
          });
        } catch (e) {}
      })();

    <style>
      :root {
        --bg: #eef1ee;
        --card: #ffffff;
        --card-soft: #f4f7f4;
        --ink: #1a201c;
        --ink-2: #5b675f;
        --ink-3: #8d988f;
        --line: #e1e7e2;
        --accent: #17573a;
        --pos: #1e6b42;
        --accent-soft: #e2efe6;
        --warn: #bf3b21;
        --warn-soft: #fbe9e4;
        --low: #96690a;
        --low-bar: #d9a514;
        --low-soft: #faf0cd;
        --trip: #8a5a12;
        --trip-soft: #f7ecd4;
        --shadow: 0 1px 2px rgba(20, 45, 30, .05), 0 8px 22px rgba(20, 45, 30, .05);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f130f;
          --card: #1c211c;
          --card-soft: #242b24;
          --ink: #edf2ed;
          --ink-2: #a7b3a9;
          --ink-3: #768276;
          --line: #2d362d;
          --accent: #2f7d54;
          --pos: #5cb98a;
          --accent-soft: #22402f;
          --warn: #e0785c;
          --warn-soft: #452a22;
          --low: #e3b93e;
          --low-bar: #c99a17;
          --low-soft: #3d3418;
          --trip: #d8ab54;
          --trip-soft: #3d3220;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.3);
        }
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font-family: inherit; }
      .app {
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        padding: calc(8px + env(safe-area-inset-top)) 16px calc(4px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      /* 月切り替え */
      .monthbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .monthbar button.nav {
        width: 32px; height: 32px;
        border: none;
        background: var(--card);
        color: var(--ink);
        border-radius: 50%;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        flex: none;
        box-shadow: var(--shadow);
      }
      .monthbar button.nav:disabled { opacity: .3; cursor: default; }
      .month-title {
        flex: 1;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .02em;
      }

      /* 画面（ホーム／分析） */
      .view {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
        gap: 7px;
      }
      .view.active { display: flex; }
      @media (prefers-reduced-motion: no-preference) {
        .view.active { animation: fadein .18s ease-out; }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 11px 14px;
        flex: none;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
      }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-head .head-note { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

      .bar {
        height: 6px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
      .bar.over > i { background: var(--warn); }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

      /* ヒーロー：今月あと使える金額 */
      .hero { padding: 11px 16px 10px; border-radius: 20px; }
      .hero .label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
      .hero .big {
        font-size: 38px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: .01em;
        color: var(--pos);
        white-space: nowrap;
        margin-top: 1px;
      }
      .hero .big.neg { color: var(--warn); }
      .hero .big small { font-size: 17px; font-weight: 700; margin-left: 2px; }
      .hero .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 5px;
      }
      .hero .sub b { color: var(--ink); font-weight: 700; }
      .hero .bar { margin-top: 7px; }

      /* 出張カード */
      .trip-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
      }
      .trip-name { font-size: 15px; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .trip-name .period {
        font-size: 11px;
        font-weight: 700;
        color: var(--trip);
        background: var(--trip-soft);
        border-radius: 6px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .trip-remain { text-align: right; flex: none; }
      .trip-remain .r-label { font-size: 11px; font-weight: 600; color: var(--ink-2); }
      .trip-remain .r-value { font-size: 21px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
      .trip-remain .r-value small { font-size: 12px; font-weight: 700; color: var(--ink-2); }
      .trip-info {
        font-size: 11.5px;
        color: var(--ink-2);
        margin-top: 6px;
        line-height: 1.5;
      }
      .trip-info b { color: var(--ink); font-weight: 700; }
      .trip-stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid var(--line);
      }
      .trip-stat .s-label { font-size: 10.5px; font-weight: 600; color: var(--ink-3); line-height: 1.35; white-space: nowrap; }
      .trip-stat .s-value { font-size: 15.5px; font-weight: 800; margin-top: 1px; white-space: nowrap; }
      .trip-stat .s-value small { font-size: 11px; font-weight: 700; color: var(--ink-2); }

      /* ひとことアドバイス */
      .advice-card { padding: 10px 14px; }
      .advice-title { display: flex; align-items: center; gap: 6px; }
      .advice-title svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
      .advice-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .advice-item { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
      .advice-item .dot { margin-top: 5px; }
      .advice-item b { color: var(--ink); font-weight: 700; }

      /* ドーナツグラフ */
      .donut-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .donut-box {
        position: relative;
        width: 76px; height: 76px;
        flex: none;
      }
      .donut-box.small { width: 72px; height: 72px; }
      .donut-svg { width: 100%; height: 100%; display: block; }
      .donut-track { stroke: var(--line); }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
      }
      .donut-center .c-label { font-size: 9.5px; font-weight: 600; color: var(--ink-3); }
      .donut-center .c-value { font-size: 11.5px; font-weight: 800; line-height: 1.2; white-space: nowrap; }
      .donut-box.small .c-value { font-size: 11px; }
      .donut-legend { flex: 1; min-width: 0; }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 0;
      }
      .legend-row + .legend-row { border-top: 1px solid var(--line); }
      .legend-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; line-height: 1.3; }
      .legend-pct { font-size: 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
      .legend-amt { font-size: 13px; font-weight: 800; white-space: nowrap; }

      /* 貯蓄の進捗 */
      .save-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .save-cell .sv-name { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; line-height: 1.3; }
      .save-cell .sv-value { font-size: 16px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
      .save-cell .sv-value small { font-size: 10.5px; font-weight: 700; color: var(--ink-2); }
      .save-cell .sv-goal { font-size: 10.5px; color: var(--ink-3); margin-top: 0; white-space: nowrap; }
      .save-cell .bar { height: 4px; margin-top: 5px; }

      /* 最近の取引 */
      .recent-card { flex: 1; min-height: 0; display: flex; flex-direction: column; cursor: pointer; }
      .recent-list { display: flex; flex-direction: column; }
      .tx { padding: 5px 0; }
      .tx + .tx { border-top: 1px solid var(--line); }

      var MONTHS = ["2026-10", "2026-11", "2026-12"];
      var cur = 1; // 2026-11
      var curMonthPays = [];

      function yen(n) { return n.toLocaleString("ja-JP"); }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function monthKey(dateStr) { return dateStr.slice(0, 7); }
      function inTrip(p) { return p.date >= TRIP.start && p.date <= TRIP.end; }
      function isBudgetCat(name) { return BUDGETS.some(function (b) { return b.name === name; }); }

      var tripStats = null;

      /* ---------- 出張カード（計算は従来どおり） ---------- */
      function renderTrip() {
        var food = 0, trans = 0;
        var foodDates = {}, lastFoodDate = null;
        PAYMENTS.forEach(function (p) {
          if (p.cat === "出張（食費）" && inTrip(p)) {
            food += p.amount;
            foodDates[p.date] = true;
            if (!lastFoodDate || p.date > lastFoodDate) lastFoodDate = p.date;
          }
          if (p.cat === "出張（交通・宿泊・燃料）") trans += p.amount;
        });
        var remain = TRIP.allowance - food;
        document.getElementById("tripRemain").textContent = yen(remain);
        document.getElementById("tripFood").textContent = yen(food);
        document.getElementById("tripTrans").textContent = yen(trans);
        // 食費の1日平均（食費の記録がある日数で割る）・残り日数・1日あたりの目安
        var foodDays = Object.keys(foodDates).length;
        var avg = foodDays ? Math.round(food / foodDays) : 0;
        var DAY = 86400000;
        function toTime(d) { var s = d.split("-"); return Date.UTC(+s[0], +s[1] - 1, +s[2]); }
        var ref = lastFoodDate || TRIP.start;
        var daysLeft = Math.max(0, Math.round((toTime(TRIP.end) - toTime(ref)) / DAY));
        var perDay = daysLeft > 0 ? Math.floor(remain / daysLeft) : remain;
        document.getElementById("tripAvg").textContent = yen(avg);
        document.getElementById("tripDaysLeft").textContent = daysLeft;
        document.getElementById("tripPerDay").textContent = yen(perDay);
        tripStats = { food: food, trans: trans, remain: remain, avg: avg, foodDays: foodDays, daysLeft: daysLeft, perDay: perDay };
      }

      /* ---------- ひとことアドバイス（表示時にルールベースで最大3件生成） ---------- */
      function buildAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct) {
        var items = [];
        var limit = window.innerHeight < 900 ? 2 : 3;
        function add(tone, html) {
          if (items.length < limit) items.push({ tone: tone, html: html });
        }
        // 予算超過の区分（超過額が大きい順）
        var overs = [];
        BUDGETS.forEach(function (b) {
          var rem = b.amount - (usedByCat[b.name] || 0);
          if (rem < 0) overs.push({ name: b.name, over: -rem });
        });
        overs.sort(function (a, b) { return b.over - a.over; });
        overs.forEach(function (o) {
          add("warn", "<b>" + esc(o.name) + "</b>が予算を<b>" + yen(o.over) + "円</b>超えています。来月は抑えめに。");
        });
        // 残りわずかの区分（残り率が小さい順）
        var lows = [];
        BUDGETS.forEach(function (b) {
          var used = usedByCat[b.name] || 0;
          var rem = b.amount - used;
          if (rem >= 0 && used > 0 && b.amount > 0 && rem <= b.amount * 0.2) {
            lows.push({ name: b.name, rem: rem, ratio: rem / b.amount });
          }
        });
        lows.sort(function (a, b) { return a.ratio - b.ratio; });
        lows.forEach(function (l) {
          add("low", "<b>" + esc(l.name) + "</b>の残りは<b>" + yen(l.rem) + "円</b>だけ。月末まで慎重に。");
        });
        // 出張手当：残りと食費の1日平均から
        if (tripStats && tripStats.foodDays > 0 && items.length < limit) {
          if (tripStats.daysLeft > 0 && tripStats.avg > tripStats.perDay) {
            add("low", "出張の食費は1日平均<b>" + yen(tripStats.avg) + "円</b>。残り" + tripStats.daysLeft + "日は1日<b>" + yen(tripStats.perDay) + "円</b>以内に抑えましょう。");
          } else {
            add("good", "出張手当は残り<b>" + yen(tripStats.remain) + "円</b>。食費の1日平均<b>" + yen(tripStats.avg) + "円</b>は目安（1日" + yen(tripStats.perDay) + "円）以内です。");
          }
        }
        // 今月の予算消化ペース（表示月が今月のときだけ）
        var now = new Date();
        var nowKey = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2);
        if (key === nowKey && totalUsed > 0 && items.length < limit) {
          var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
          var elapsedPct = Math.round(now.getDate() / daysInMonth * 1000) / 10;
          if (pct > elapsedPct + 10) {
            add("low", "今月は" + now.getDate() + "日時点で予算の<b>" + pct + "%</b>を使用（経過" + elapsedPct + "%）。ペースが速めです。");
          } else if (pct <= elapsedPct) {
            add("good", "予算の消化は使用率<b>" + pct + "%</b>で経過（" + elapsedPct + "%）以内。順調です。");
          }
        }
        // 貯蓄の進捗
        if (items.length < limit) {
          var saveUsed = 0, saveGoal = 0;
          BUDGETS.forEach(function (b) {
            if (SAVE_NAMES.indexOf(b.name) >= 0) { saveUsed += usedByCat[b.name] || 0; saveGoal += b.amount; }
          });
          if (saveUsed > 0 && saveGoal > 0) {
            var sp = Math.round(saveUsed / saveGoal * 1000) / 10;
            add("good", "今月の貯蓄は<b>" + yen(saveUsed) + "円</b>（目標の" + sp + "%）。着実に進んでいます。");
          }
        }
        // 前月より減らせた区分（一番減ったもの）
        if (items.length < limit) {
          var bestDown = null;
          BUDGETS.forEach(function (b) {
            var prev = prevUsedByCat[b.name] || 0;
            var diff = prev - (usedByCat[b.name] || 0);
            if (prev > 0 && diff > 0 && (!bestDown || diff > bestDown.diff)) bestDown = { name: b.name, diff: diff };
          });
          if (bestDown) {
            add("good", "<b>" + esc(bestDown.name) + "</b>は前月より<b>" + yen(bestDown.diff) + "円</b>減らせています。その調子です。");
          }
        }
        // 該当なしのときの無難な一言
        if (!items.length) {
          if (totalUsed === 0) {
            items.push({ tone: "good", html: "今月はまだ目立った支出がありません。良いスタートです。" });
          } else {
            items.push({ tone: "good", html: "今月は予算内で順調です。無理のないペースで続けましょう。" });
          }
        }
        return items;
      }
      function renderAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct) {
        var list = document.getElementById("adviceList");
        var colors = { warn: "var(--warn)", low: "var(--low-bar)", good: "var(--pos)" };
        list.innerHTML = buildAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct).map(function (it) {
          return '<li class="advice-item"><span class="dot" style="background:' + (colors[it.tone] || "var(--accent)") + '"></span><span>' + it.html + "</span></li>";
        }).join("");
      }

      /* ---------- ドーナツグラフ ---------- */
      function donutSlices(monthPays) {
        var byCat = {}, total = 0;
        monthPays.forEach(function (p) {
          byCat[p.cat] = (byCat[p.cat] || 0) + p.amount;
          total += p.amount;
        });
        var slices = Object.keys(byCat).map(function (name) {
          return { name: name, amount: byCat[name], color: CAT_COLORS[name] || "#68707c" };
        }).sort(function (a, b) { return b.amount - a.amount; });
        if (slices.length > 5) {
          var rest = slices.slice(4);
          var restAmt = rest.reduce(function (s, x) { return s + x.amount; }, 0);
          slices = slices.slice(0, 4);
          slices.push({ name: "その他", amount: restAmt, color: "#98a29b" });
        }
        return { slices: slices, total: total };
      }
      function donutHTML(monthPays, small) {
        var d = donutSlices(monthPays);
        if (!d.total) {
          return '<div class="empty">この月の支出はまだありません</div>';
        }
        var C = 2 * Math.PI * 40;
        var acc = 0, parts = "";
        d.slices.forEach(function (s) {
          var len = s.amount / d.total * C;
          var draw = d.slices.length > 1 ? Math.max(0, len - 1.8) : len;
          parts += '<circle cx="50" cy="50" r="40" fill="none" stroke="' + s.color + '" stroke-width="13" stroke-dasharray="' + draw.toFixed(2) + " " + (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 50 50)"/>';
          acc += len;
        });
        var svg = '<svg class="donut-svg" viewBox="0 0 100 100" aria-hidden="true">' +
          '<circle class="donut-track" cx="50" cy="50" r="40" fill="none" stroke-width="13"/>' + parts + "</svg>";
        var legend = d.slices.map(function (s) {
          var pct = Math.round(s.amount / d.total * 1000) / 10;
          return '<div class="legend-row"><span class="dot" style="background:' + s.color + '"></span>' +
            '<span class="legend-name">' + esc(s.name) + "</span>" +
            '<span class="legend-pct">' + pct + "%</span>" +
            '<span class="legend-amt">' + yen(s.amount) + "円</span></div>";
        }).join("");
        return '<div class="donut-wrap"><div class="donut-box' + (small ? " small" : "") + '">' + svg +
          '<div class="donut-center"><span class="c-label">合計</span><span class="c-value">' + yen(d.total) + "円</span></div></div>" +
          '<div class="donut-legend">' + legend + "</div></div>";
      }

      /* ---------- 最近の取引 ---------- */
      function recentCount() {
        if (window.matchMedia("(min-width: 900px)").matches) return 8;
        if (window.innerHeight >= 900) return 3;
        return 2;
      }
      function txRowHTML(p) {
        var color = CAT_COLORS[p.cat] || "#68707c";
        var md = parseInt(p.date.slice(5, 7), 10) + "月" + parseInt(p.date.slice(8, 10), 10) + "日";
        var sub = md + (p.note ? " ・ " + p.note : "") + " ・ " + p.method + (p.time ? " ・ " + p.time : "");
        return '<div class="tx"><div class="tx-line1">' +
          '<span class="tx-store">' + esc(p.store) + "</span>" +
          '<span class="chip" style="background:' + color + '22;color:' + color + '">' + esc(p.cat) + "</span>" +
          '<span class="tx-amount">' + yen(p.amount) + "円</span></div>" +
          '<div class="tx-line2"><span class="tx-sub">' + esc(sub) + "</span></div></div>";
      }
      function renderRecent() {
        var list = document.getElementById("recentList");
        var more = document.getElementById("recentMore");
        var monthTotal = curMonthPays.reduce(function (s, p) { return s + p.amount; }, 0);
        document.getElementById("payMonthTotal").textContent = curMonthPays.length ? "合計 " + yen(monthTotal) + "円 ・ " : "";
        if (!curMonthPays.length) {
          list.innerHTML = '<div class="empty">この月の支払いはまだありません</div>';
          more.style.display = "none";
          return;
        }
        var n = recentCount();
        list.innerHTML = curMonthPays.slice(0, n).map(txRowHTML).join("");
        more.style.display = "";
        more.textContent = "すべての支払いを見る（全" + curMonthPays.length + "件）›";
      }

      /* ---------- メインレンダリング ---------- */
      function render() {
        var key = MONTHS[cur];
        var y = key.slice(0, 4), m = parseInt(key.slice(5, 7), 10);
        document.getElementById("monthTitle").textContent = y + "年" + m + "月";
        document.getElementById("prevMonth").disabled = cur === 0;
        document.getElementById("nextMonth").disabled = cur === MONTHS.length - 1;

        var usedByCat = {};
        var pm = m - 1, py = y;
        if (pm < 1) { pm = 12; py = String(+y - 1); }
        var prevKey = py + "-" + ("0" + pm).slice(-2);
        var prevUsedByCat = {};
        PAYMENTS.forEach(function (p) {
          if (!isBudgetCat(p.cat)) return;
          if (monthKey(p.date) === key) usedByCat[p.cat] = (usedByCat[p.cat] || 0) + p.amount;
          if (monthKey(p.date) === prevKey) prevUsedByCat[p.cat] = (prevUsedByCat[p.cat] || 0) + p.amount;
        });
        var totalBudget = 0, totalUsed = 0;
        BUDGETS.forEach(function (b) { totalBudget += b.amount; totalUsed += usedByCat[b.name] || 0; });
        var remain = totalBudget - totalUsed;
        var pct = totalBudget ? Math.round(totalUsed / totalBudget * 1000) / 10 : 0;

        // ヒーロー
        document.getElementById("heroLabel").textContent = m + "月あと使える金額";
        document.getElementById("heroRemain").textContent = yen(remain);
        document.getElementById("heroBig").classList.toggle("neg", remain < 0);
        document.getElementById("heroBudget").textContent = yen(totalBudget);
        document.getElementById("heroUsed").textContent = yen(totalUsed);
        document.getElementById("heroPct").textContent = pct;
        var heroBar = document.getElementById("heroBar");
        heroBar.style.width = Math.min(100, pct) + "%";
        heroBar.style.background = remain < 0 ? "var(--warn)" : "var(--accent)";

        // 表示月の支払い（新しい順）
        var monthPays = PAYMENTS.filter(function (p) { return monthKey(p.date) === key; });
        monthPays.sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return (b.time || "") < (a.time || "") ? -1 : 1;
        });
        curMonthPays = monthPays;

        // ドーナツ（ホーム／分析で共用）
        document.getElementById("donutMonth").textContent = m + "月の支出";
        document.getElementById("donutMonthA").textContent = m + "月の支出";
        document.getElementById("donutHome").innerHTML = donutHTML(monthPays, false);
        document.getElementById("donutAnalysis").innerHTML = donutHTML(monthPays, true);

        // 貯蓄の進捗
        var saveGrid = document.getElementById("saveGrid");
        saveGrid.innerHTML = "";
        BUDGETS.filter(function (b) { return SAVE_NAMES.indexOf(b.name) >= 0; }).forEach(function (b) {
          var used = usedByCat[b.name] || 0;
          var p = b.amount ? Math.min(100, Math.round(used / b.amount * 1000) / 10) : 0;
          var cell = document.createElement("div");
          cell.className = "save-cell";
          cell.innerHTML =
            '<div class="sv-name"><span class="dot" style="background:' + b.color + '"></span>' + esc(b.name) + "</div>" +
            '<div class="sv-value">' + yen(used) + "<small> 円</small></div>" +
            '<div class="sv-goal">目標 ' + yen(b.amount) + "円 ・ " + p + "%</div>" +
            '<div class="bar"><i style="width:' + p + "%;background:" + b.color + '"></i></div>';
          saveGrid.appendChild(cell);
        });

        // 分析：区分ごとの使用率＋前月比較
        var list = document.getElementById("analysisList");
        list.innerHTML = "";
        BUDGETS.forEach(function (b) {
          var used = usedByCat[b.name] || 0;
          var rem = b.amount - used;
          var p = b.amount ? Math.min(100, Math.round(used / b.amount * 1000) / 10) : 0;
          var isOver = rem < 0;
          var isLow = !isOver && b.amount > 0 && rem <= b.amount * 0.2;
          var diff = used - (prevUsedByCat[b.name] || 0);
          var diffHTML;
          if (diff > 0) diffHTML = '前月比 <b class="up">+' + yen(diff) + "円</b>";
          else if (diff < 0) diffHTML = '前月比 <b class="down">−' + yen(-diff) + "円</b>";
          else diffHTML = "前月比 <b>±0円</b>";
          var barColor = isOver ? "var(--warn)" : (isLow ? "var(--low-bar)" : b.color);
          var row = document.createElement("div");
          row.className = "arow" + (isOver ? " over" : "") + (isLow ? " low" : "");
          row.innerHTML =
            '<div class="arow-top"><span class="arow-name"><span class="dot" style="background:' + b.color + '"></span>' + esc(b.name) + '</span><span class="arow-remain">' + yen(rem) + "<small> 円 残り</small></span></div>" +
            '<div class="bar' + (isOver ? " over" : "") + '"><i style="width:' + p + "%;background:" + barColor + '"></i></div>' +
            '<div class="arow-sub"><span>使った ' + yen(used) + "円 / 予算 " + yen(b.amount) + "円 ・ 使用率 " + p + '%</span><span class="arow-diff">' + diffHTML + "</span></div>";
          list.appendChild(row);
        });

        renderAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct);
        renderRecent();
      }

      /* ---------- 全件オーバーレイ ---------- */
      function payItemHTML(p) {
        var color = CAT_COLORS[p.cat] || "#68707c";
        return '<div class="pay"><div class="pay-line1">' +
          '<span class="pay-store">' + esc(p.store) + '</span>' +
          '<span class="pay-amount">' + yen(p.amount) + '円</span></div>' +
          '<div class="pay-line2">' +
          (p.note ? '<span class="pay-note">' + esc(p.note) + '</span>' : "") +
          '<span class="pay-sub">' + esc(p.method) + (p.time ? " ・ " + esc(p.time) : "") + '</span>' +
          '<span class="chip" style="background:' + color + '22;color:' + color + '">' + esc(p.cat) + "</span>" +
          "</div></div>";
      }
      function groupedHTML(monthPays) {
        var days = {}, order = [];
        monthPays.forEach(function (p) {
          if (!days[p.date]) { days[p.date] = []; order.push(p.date); }
          days[p.date].push(p);
        });
        var week = ["日", "月", "火", "水", "木", "金", "土"];
        var html = "";
        order.forEach(function (d) {
          var items = days[d];
          var sum = items.reduce(function (s, p) { return s + p.amount; }, 0);
          var parts = d.split("-");
          var dt = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
          var head = parseInt(d.slice(5, 7), 10) + "月" + parseInt(d.slice(8, 10), 10) + "日（" + week[dt.getUTCDay()] + "）";
          html += '<div class="day-head"><span>' + head + '</span><span class="day-total">合計 ' + yen(sum) + "円</span></div>";
          items.forEach(function (p) { html += payItemHTML(p); });
        });
        return html;
      }

      var overlay = document.getElementById("overlay");
      var sheetQuery = "", sheetCat = "";
      function renderSheet() {
        var key = MONTHS[cur];
        var m = parseInt(key.slice(5, 7), 10);
        var q = sheetQuery.trim();
        var filtered = curMonthPays.filter(function (p) {
          if (sheetCat && p.cat !== sheetCat) return false;
          if (q && p.store.indexOf(q) < 0) return false;
          return true;
        });
        var total = filtered.reduce(function (s, p) { return s + p.amount; }, 0);
        var filtering = q || sheetCat;
        document.getElementById("sheetTitle").textContent =
          m + "月の支払い（" + (filtering ? filtered.length + "件／全" + curMonthPays.length + "件" : "全" + curMonthPays.length + "件") + "）";
        document.getElementById("sheetTotal").textContent = "合計 " + yen(total) + "円";
        document.getElementById("sheetBody").innerHTML = filtered.length
          ? groupedHTML(filtered)
          : '<div class="empty">条件に合う支払いはありません</div>';
        document.getElementById("sheetBody").scrollTop = 0;
      }
      function openOverlay() {
        if (!curMonthPays.length) return;
        var sel = document.getElementById("sheetFilter");
        var cats = [];
        curMonthPays.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
        sel.innerHTML = '<option value="">全ての区分</option>' + cats.map(function (c) {
          return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
        }).join("");
        sel.value = cats.indexOf(sheetCat) >= 0 ? sheetCat : "";
        sheetCat = sel.value;
        renderSheet();
        overlay.classList.add("open");
      }
      function closeOverlay() { overlay.classList.remove("open"); }
      document.getElementById("sheetSearch").addEventListener("input", function (e) {
        sheetQuery = e.target.value;
        renderSheet();
      });
      document.getElementById("sheetFilter").addEventListener("change", function (e) {
        sheetCat = e.target.value;
        renderSheet();
      });
      document.getElementById("recentCard").addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest("#csvBtn")) return;
        openOverlay();
      });
      document.getElementById("sheetClose").addEventListener("click", closeOverlay);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeOverlay(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });

      /* ---------- CSV出力 ---------- */
      function csvCell(v) {
        v = String(v == null ? "" : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }
      document.getElementById("csvBtn").addEventListener("click", function () {
        var key = MONTHS[cur];
        var rows = [["日付", "時刻", "店名", "金額", "メモ", "支払い方法", "区分"]];
        PAYMENTS.filter(function (p) { return monthKey(p.date) === key; }).forEach(function (p) {
          rows.push([p.date, p.time || "", p.store, p.amount, p.note || "", p.method, p.cat]);
        });
        var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
        var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "payments-" + key + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });

      /* ---------- 画面切り替え（ホーム／分析） ---------- */
      function setView(name) {
        var home = name === "home";
        document.getElementById("viewHome").classList.toggle("active", home);
        document.getElementById("viewAnalysis").classList.toggle("active", !home);
        document.getElementById("tabHome").classList.toggle("active", home);
        document.getElementById("tabAnalysis").classList.toggle("active", !home);
        document.getElementById("tabHome").setAttribute("aria-pressed", home ? "true" : "false");
        document.getElementById("tabAnalysis").setAttribute("aria-pressed", !home ? "true" : "false");
      }
      document.getElementById("tabHome").addEventListener("click", function () { setView("home"); });
      document.getElementById("tabAnalysis").addEventListener("click", function () { setView("analysis"); });

      /* ---------- 月切り替え ---------- */
      function changeMonth(d) {
        var n = cur + d;
        if (n < 0 || n >= MONTHS.length) return;
        cur = n;
        sheetQuery = ""; sheetCat = "";
        document.getElementById("sheetSearch").value = "";
        render();
      }
      document.getElementById("prevMonth").addEventListener("click", function () { changeMonth(-1); });
      document.getElementById("nextMonth").addEventListener("click", function () { changeMonth(1); });
      window.addEventListener("resize", renderRecent);

      renderTrip();
      render();
    </script>
  </body>
</html>
