    <script>
      (function () {
        var ownMeta = document.querySelector('meta[name="build-id"]');
        var ownId = ownMeta ? ownMeta.getAttribute("content") : null;
        // 再読み込みはこのページ表示につき最大1回まで。
        // 取得側と自分の版番号が交互に食い違う環境でもループさせないための歯止め：
        // URLに v= が付いて届いた表示では、版番号が違っても二度と再読み込みしない。
        var arrivedWithV = /[?&]v=/.test(location.search || "");
        var finished = false;
        function checkForUpdate() {
          try {
            if (finished || !ownId || !window.fetch) return;
            var base = location.href.split(/[?#]/)[0];
            fetch(base + "?check=" + Date.now(), { cache: "no-store" })
              .then(function (res) { return res.ok ? res.text() : null; })
              .then(function (html) {
                if (!html) return;
                var m = html.match(/<meta[^>]+name=["']build-id["'][^>]+content=["']([^"']+)["']/i) ||
                        html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']build-id["']/i);
                if (!m) return;
                var fetchedId = m[1];
                if (!fetchedId) return;
                if (fetchedId === ownId) { finished = true; return; }
                if (arrivedWithV) { finished = true; return; }
                var already = null;
                try { already = sessionStorage.getItem("reloaded-for"); } catch (e) {}
                if (already === fetchedId) { finished = true; return; }
                try { sessionStorage.setItem("reloaded-for", fetchedId); } catch (e) {}
                finished = true;
                location.replace(base + "?v=" + encodeURIComponent(fetchedId));
              })
              .catch(function () {});
          } catch (e) {}
        }
        checkForUpdate();
        window.addEventListener("pageshow", checkForUpdate);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") checkForUpdate();
        });
      })();
    </script>
    <style>
      :root {
        --bg: #eef1ee;
        --card: #ffffff;
        --card-soft: #f4f7f4;
        --ink: #1a201c;
        --ink-2: #5b675f;
        --ink-3: #8d988f;
        --line: #e1e7e2;
        --accent: #17573a;
        --pos: #1e6b42;
        --accent-soft: #e2efe6;
        --warn: #bf3b21;
        --warn-soft: #fbe9e4;
        --low: #96690a;
        --low-bar: #d9a514;
        --low-soft: #faf0cd;
        --trip: #8a5a12;
        --trip-soft: #f7ecd4;
        --shadow: 0 1px 2px rgba(20, 45, 30, .05), 0 8px 22px rgba(20, 45, 30, .05);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f130f;
          --card: #1c211c;
          --card-soft: #242b24;
          --ink: #edf2ed;
          --ink-2: #a7b3a9;
          --ink-3: #768276;
          --line: #2d362d;
          --accent: #2f7d54;
          --pos: #5cb98a;
          --accent-soft: #22402f;
          --warn: #e0785c;
          --warn-soft: #452a22;
          --low: #e3b93e;
          --low-bar: #c99a17;
          --low-soft: #3d3418;
          --trip: #d8ab54;
          --trip-soft: #3d3220;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.3);
        }
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        /* ページ自体はスクロールさせない：バウンス（ラバーバンド）の連鎖も止める */
        overscroll-behavior: none;
        touch-action: pan-y;
      }
      button { font-family: inherit; }

      /* 数字・英字は Space Grotesk を優先（日本語グリフは Zen Kaku Gothic New にフォールバック） */
      .month-title, .hero .big, .hero .sub b, .ring-pct, .cat-remain, .cat-pct,
      .trip-remain .r-value, .trip-meta b, .donut-center .c-value, .legend-amt, .legend-pct,
      .tx-amount, .arow-remain, .arow-pct, .arow-diff, .pay-amount, .sheet-total, .day-head .day-total {
        font-family: "Space Grotesk", "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      /* 小さなラベル類は字間を広めにしてシャープに揃える */
      .hero .label, .card-title, .card-head .head-note, .cat-name, .tab,
      .foot, .donut-center .c-label, .trip-name .period {
        letter-spacing: .08em;
      }
      /* アプリ本体は画面に固定して密着させる。
         100dvh は実機（ホーム画面表示やSafari）で実際の表示領域より大きく
         算出されることがあり、その分だけ下がはみ出してスクロールできて
         しまい、最下部でバウンスと干渉して固まったように見えた。
         fixed + inset:0 なら表示領域そのものに一致し、ページは一切
         スクロールしなくなる。高さの過不足は内部のフレックス配分
         （区分グリッドと最近の取引カードの縮み）で吸収する。 */
      .app {
        position: fixed;
        inset: 0;
        max-width: 560px;
        margin: 0 auto;
        padding: calc(8px + env(safe-area-inset-top)) 16px calc(4px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 7px;
        overflow: hidden;
      }

      /* 月切り替え */
      .monthbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .monthbar button.nav {
        width: 32px; height: 32px;
        border: none;
        background: var(--card);
        color: var(--ink);
        border-radius: 50%;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        flex: none;
        box-shadow: var(--shadow);
      }
      .monthbar button.nav:disabled { opacity: .3; cursor: default; }
      .month-title {
        flex: 1;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .05em;
      }

      /* 画面（ホーム／分析） */
      .view {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
        gap: 7px;
      }
      .view.active { display: flex; }
      @media (prefers-reduced-motion: no-preference) {
        .view.active { animation: fadein .18s ease-out; }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 11px 14px;
        flex: none;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
      }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-head .head-note { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

      .bar {
        height: 6px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

      /* ヒーロー：今月あと使える金額＋円形リング */
      .hero { padding: 12px 16px; border-radius: 20px; }
      .hero-flex { display: flex; align-items: center; gap: 14px; }
      .hero-text { flex: 1; min-width: 0; }
      .hero .label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
      .hero .big {
        font-size: 42px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: var(--pos);
        white-space: nowrap;
        margin-top: 1px;
      }
      .hero .big.neg { color: var(--warn); }
      .hero .big small { font-size: 18px; font-weight: 700; margin-left: 2px; }
      .hero .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        font-size: 11.5px;
        color: var(--ink-2);
        margin-top: 4px;
      }
      .hero .sub b { color: var(--ink); font-weight: 700; }
      .ring-box {
        position: relative;
        width: 84px; height: 84px;
        flex: none;
      }
      .ring-svg {
        width: 100%; height: 100%;
        display: block;
        transform: rotate(-90deg);
      }
      .ring-svg circle { fill: none; stroke-width: 9; }
      .ring-track { stroke: var(--line); }
      .ring-fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 226.2; stroke-dashoffset: 226.2; }
      @media (prefers-reduced-motion: no-preference) {
        .ring-fg { transition: stroke-dashoffset .5s ease; }
      }
      .ring-center {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .ring-pct { font-size: 19px; font-weight: 700; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; }
      .ring-pct small { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-left: 1px; }

      /* 区分カードグリッド */
      .cat-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }
      .cat-card {
        background: var(--card);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 7px 11px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-height: 0;
        overflow: hidden;
      }
      .cat-top { display: flex; align-items: center; gap: 6px; }
      .cat-ico { font-size: 16px; line-height: 1; flex: none; }
      .cat-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
      .cat-pct { font-size: 10.5px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
      .cat-remain { font-size: 19px; font-weight: 700; line-height: 1.15; white-space: nowrap; letter-spacing: -0.02em; }
      .cat-remain small { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-left: 1px; }
      .cat-card .bar { height: 4px; margin-top: 3px; }
      .cat-card.over .cat-remain { color: var(--warn); }
      .cat-card.low .cat-remain { color: var(--low); }

      /* 出張カード */
      .trip-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .trip-name { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .trip-ico { font-size: 17px; line-height: 1; }
      .trip-name .period {
        font-size: 11px;
        font-weight: 700;
        color: var(--trip);
        background: var(--trip-soft);
        border-radius: 6px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .trip-remain { text-align: right; flex: none; }
      .trip-remain .r-value { font-size: 23px; font-weight: 700; line-height: 1.15; white-space: nowrap; letter-spacing: -0.02em; }
      .trip-remain .r-value small { font-size: 12px; font-weight: 700; color: var(--ink-2); }
      .trip-bar { height: 5px; margin-top: 8px; }
      .trip-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 12px;
        font-size: 11px;
        color: var(--ink-2);
        margin-top: 6px;
        line-height: 1.5;
      }
      .trip-meta b { color: var(--ink); font-weight: 700; }

      /* ひとことアドバイス（1行） */
      .advice-card {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
      }
      .advice-ico {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--low-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        line-height: 1;
        flex: none;
      }
      .advice-card.tone-warn .advice-ico { background: var(--warn-soft); }
      .advice-card.tone-good .advice-ico { background: var(--accent-soft); }
      .advice-card.tone-low .advice-ico { background: var(--low-soft); }
      .advice-text {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.45;
      }

      /* ドーナツグラフ（分析） */
      .donut-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .donut-box {
        position: relative;
        width: 100px; height: 100px;
        flex: none;
      }
      .donut-svg { width: 100%; height: 100%; display: block; }
      .donut-track { stroke: var(--line); }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
      }
      .donut-center .c-label { font-size: 9.5px; font-weight: 600; color: var(--ink-3); }
      .donut-center .c-value { font-size: 13px; font-weight: 700; line-height: 1.2; white-space: nowrap; letter-spacing: -0.02em; }
      .donut-legend { flex: 1; min-width: 0; }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 0;
      }
      .legend-row + .legend-row { border-top: 1px solid var(--line); }
      .legend-ico { font-size: 14px; line-height: 1; width: 18px; text-align: center; flex: none; }
      .legend-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; line-height: 1.3; }
      .legend-pct { font-size: 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
      .legend-amt { font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: -0.02em; }

      /* 最近の取引 */
      /* 最近の取引：画面高が足りないときはこのカードが縮んで吸収し、
         下部の更新日時とタブバーが画面外に押し出されないようにする */
      .recent-card { cursor: pointer; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .recent-list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .tx { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
      .tx + .tx { border-top: 1px solid var(--line); }
      .tx-ico {
        width: 30px; height: 30px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        line-height: 1;
        flex: none;
      }
      .tx-ico.sm { width: 27px; height: 27px; border-radius: 8px; font-size: 13.5px; }
      .tx-store { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.35; }
      .tx-amount { font-size: 14.5px; font-weight: 700; white-space: nowrap; flex: none; letter-spacing: -0.02em; }
      .csv-btn {
        flex: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
        border-radius: 8px;
        padding: 3px 9px;
        margin-left: 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      .recent-more {
        margin-top: 6px;
        width: 100%;
        border: none;
        background: var(--card-soft);
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 700;
        border-radius: 10px;
        padding: 7px 10px;
        cursor: pointer;
      }
      .empty {
        text-align: center;
        color: var(--ink-3);
        font-size: 13px;
        padding: 20px 10px;
      }

      /* 分析：区分ごとの使用率バー */
      .analysis-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .analysis-list { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .analysis-list .arow { flex: 1 1 0; min-height: 0; }
      .arow { padding: 6px 0; display: flex; flex-direction: column; justify-content: center; }
      .arow + .arow { border-top: 1px solid var(--line); }
      .arow-top { display: flex; align-items: center; gap: 7px; }
      .arow-ico { font-size: 15px; line-height: 1; flex: none; }
      .arow-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
      .arow-pct { font-size: 10.5px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
      .arow-diff { margin-left: auto; font-size: 11px; font-weight: 800; white-space: nowrap; color: var(--ink-3); }
      .arow-diff.up { color: var(--warn); }
      .arow-diff.down { color: var(--pos); }
      .arow-remain { font-size: 15px; font-weight: 700; white-space: nowrap; flex: none; letter-spacing: -0.02em; }
      .arow-remain small { font-size: 10.5px; font-weight: 700; color: var(--ink-2); margin-left: 1px; }
      .arow.over .arow-remain { color: var(--warn); }
      .arow.low .arow-remain { color: var(--low); }
      .arow .bar { height: 5px; margin-top: 5px; }

      .foot {
        flex: none;
        text-align: center;
        font-size: 10.5px;
        color: var(--ink-3);
      }

      /* 下部タブバー */
      .tabbar {
        flex: none;
        display: flex;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 5px;
        gap: 6px;
      }
      .tab {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--ink-3);
        border-radius: 11px;
        padding: 5px 4px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 10.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .tab svg { width: 20px; height: 20px; }
      .tab.active { color: var(--accent); background: var(--accent-soft); }

      /* 全件表示オーバーレイ */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(10, 18, 12, .5);
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .overlay.open { display: flex; }
      .sheet {
        background: var(--bg);
        width: 100%;
        max-width: 640px;
        max-height: 88%;
        border-radius: 18px 18px 0 0;
        display: flex;
        flex-direction: column;
        box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media (min-width: 720px) {
        .overlay { align-items: center; padding: 24px; }
        .sheet { border-radius: 18px; max-height: 82%; }
      }
      .sheet-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px 10px 14px;
      }
      .sheet-title { font-size: 16px; font-weight: 800; flex: 1; min-width: 0; }
      .sheet-total { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
      .sheet-close {
        flex: none;
        width: 32px; height: 32px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 50%;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .sheet-tools {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 0 12px 10px;
      }
      .sheet-tools input[type="search"] {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
        border-radius: 9px;
        padding: 7px 10px;
      }
      .sheet-tools select {
        flex: none;
        max-width: 42%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 9px;
        padding: 7px 6px;
      }
      .sheet-body {
        overflow-y: auto;
        padding: 0 12px 14px;
        -webkit-overflow-scrolling: touch;
        /* シート内のスクロールを背面ページへ伝播させない */
        overscroll-behavior: contain;
      }
      .sheet-body .pay { padding: 8px 10px 9px; margin-bottom: 5px; }
      .sheet-body .empty { background: var(--card); border-radius: 12px; }
      .day-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-2);
        padding: 3px 2px 3px;
      }
      .day-head:first-child { padding-top: 0; }
      .day-head .day-total { color: var(--ink); white-space: nowrap; }
      .pay {
        background: var(--card);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 6px 10px 7px;
        margin-bottom: 4px;
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }
      .pay-main { flex: 1; min-width: 0; }
      .pay-line1 { display: flex; align-items: baseline; gap: 8px; }
      .pay-store {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.3;
        word-break: break-word;
      }
      .pay-amount { font-size: 13px; font-weight: 700; white-space: nowrap; flex: none; letter-spacing: -0.02em; }
      .pay-line2 { display: flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; margin-top: 2px; }
      .pay-note { font-size: 11px; color: var(--ink-2); word-break: break-word; }
      .pay-sub { font-size: 10.5px; color: var(--ink-3); word-break: break-word; }

      /* 広い画面：2カラム */
      @media (min-width: 900px) {
        .app { max-width: 1060px; padding-left: 20px; padding-right: 20px; }
        .card { padding: 16px 18px; }
        .hero { padding: 18px 20px; }
        .hero .big { font-size: 48px; }
        .ring-box { width: 104px; height: 104px; }
        .ring-pct { font-size: 23px; }
        .cat-card { padding: 10px 14px; }
        .cat-remain { font-size: 22px; }
        .donut-box { width: 128px; height: 128px; }
        .donut-center .c-value { font-size: 15px; }
        .tx { padding: 8px 0; }
        .view-home.active {
          display: grid;
          grid-template-columns: 1.05fr 1fr;
          grid-template-rows: auto 1fr auto auto;
          grid-template-areas:
            "hero recent"
            "cats recent"
            "trip recent"
            "advice recent";
          align-items: stretch;
        }
        .hero-card { grid-area: hero; }
        .cat-grid { grid-area: cats; }
        .trip-card { grid-area: trip; }
        .advice-card { grid-area: advice; }
        .recent-card { grid-area: recent; }
        .view-analysis.active {
          display: grid;
          grid-template-columns: 380px 1fr;
          grid-template-rows: 1fr;
          align-items: stretch;
        }
        .analysis-donut { align-self: start; }
      }

      /* iPhone相当の高さでは全体を詰めて1画面に収める */
      @media (max-height: 1020px) {
        .app { gap: 4px; padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: calc(2px + env(safe-area-inset-bottom)); }
        .view { gap: 4px; }
        .card { padding: 8px 12px; }
        .card-head { margin-bottom: 4px; }
        .monthbar button.nav { width: 28px; height: 28px; font-size: 15px; }
        .month-title { font-size: 15.5px; }
        .hero { padding: 8px 13px; }
        .hero .label { font-size: 11.5px; }
        .hero .big { font-size: 31px; }
        .hero .big small { font-size: 15px; }
        .hero .sub { margin-top: 2px; font-size: 11px; }
        .ring-box { width: 58px; height: 58px; }
        .ring-pct { font-size: 14px; }
        .ring-pct small { font-size: 9.5px; }
        .cat-grid { gap: 4px; }
        .cat-card { padding: 4px 9px; border-radius: 12px; gap: 1px; }
        .cat-ico { font-size: 15px; }
        .cat-name { font-size: 12px; }
        .cat-remain { font-size: 15.5px; }
        .cat-card .bar { margin-top: 2px; }
        .trip-name { font-size: 14px; }
        .trip-ico { font-size: 16px; }
        .trip-bar { margin-top: 5px; }
        .trip-meta { margin-top: 4px; line-height: 1.4; font-size: 10.5px; }
        .trip-remain .r-value { font-size: 19px; }
        .advice-card { padding: 6px 11px; gap: 8px; }
        .advice-ico { width: 26px; height: 26px; font-size: 14px; }
        .advice-text { font-size: 12px; line-height: 1.4; }
        .donut-box { width: 80px; height: 80px; }
        .legend-row { padding: 2px 0; }
        .tx { padding: 3px 0; gap: 8px; }
        .tx-ico { width: 27px; height: 27px; border-radius: 8px; font-size: 13.5px; }
        .tx-store { font-size: 13px; }
        .tx-amount { font-size: 14px; }
        .recent-more { margin-top: 4px; padding: 5px 10px; font-size: 12px; }
        .foot { font-size: 10px; }
        .tab { padding: 3px 4px 2px; font-size: 10px; gap: 1px; }
        .tab svg { width: 17px; height: 17px; }
      }
      @media (max-height: 700px) {
        .app { gap: 5px; }
        .view { gap: 5px; }
        .hero .big { font-size: 30px; }
        .ring-box { width: 62px; height: 62px; }
        .ring-pct { font-size: 15px; }
        .cat-ico { font-size: 14px; }
        .cat-name { font-size: 11.5px; }
        .cat-remain { font-size: 15.5px; }
        .cat-card .bar { margin-top: 2px; }
        .trip-name { font-size: 13.5px; }
        .trip-remain .r-value { font-size: 18px; }
        .trip-meta { font-size: 10.5px; }
        .advice-text { font-size: 11.5px; }
        .advice-ico { width: 24px; height: 24px; font-size: 13px; }
        .donut-box { width: 76px; height: 76px; }
        .arow { padding: 4px 0; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="monthbar">
        <button class="nav" id="prevMonth" aria-label="前の月">‹</button>
        <div class="month-title" id="monthTitle">2026年11月</div>
        <button class="nav" id="nextMonth" aria-label="次の月">›</button>
      </div>

      <!-- ホーム -->
      <section class="view view-home active" id="viewHome">
        <div class="card hero hero-card">
          <div class="hero-flex">
            <div class="hero-text">
              <div class="label" id="heroLabel">11月あと使える</div>
              <div class="big" id="heroBig"><span id="heroRemain">0</span><small>円</small></div>
              <div class="sub">
                <span>使った <b><span id="heroUsed">0</span>円</b></span>
                <span>予算 <b><span id="heroBudget">0</span>円</b></span>
              </div>
            </div>
            <div class="ring-box" role="img" aria-label="今月の使用率">
              <svg class="ring-svg" viewBox="0 0 84 84" aria-hidden="true">
                <circle class="ring-track" cx="42" cy="42" r="36"></circle>
                <circle class="ring-fg" id="heroRing" cx="42" cy="42" r="36"></circle>
              </svg>
              <div class="ring-center"><span class="ring-pct"><span id="heroPct">0</span><small>%</small></span></div>
            </div>
          </div>
        </div>

        <div class="cat-grid" id="catGrid"></div>

        <div class="card trip-card">
          <div class="trip-head">
            <div class="trip-name"><span class="trip-ico" aria-hidden="true">✈️</span>福岡出張<span class="period">10/31〜11/10</span></div>
            <div class="trip-remain">
              <div class="r-value"><span id="tripRemain">0</span><small> 円</small></div>
            </div>
          </div>
          <div class="bar trip-bar"><i id="tripBar" style="width:0%"></i></div>
          <div class="trip-meta">
            <span>手当 <b>43,800円</b></span>
            <span>🍽 食費 <b><span id="tripFood">0</span>円</b></span>
            <span>🚄 交通・宿泊 <b><span id="tripTrans">0</span>円</b></span>
            <span>平均 <b><span id="tripAvg">0</span>円/日</b></span>
            <span>残り <b><span id="tripDaysLeft">0</span>日</b></span>
            <span>目安 <b><span id="tripPerDay">0</span>円/日</b></span>
          </div>
        </div>

        <div class="card advice-card tone-good" id="adviceCard">
          <span class="advice-ico" aria-hidden="true">💡</span>
          <p class="advice-text" id="adviceText"></p>
        </div>

        <div class="card recent-card" id="recentCard" title="タップで全件表示">
          <div class="card-head">
            <span class="card-title">最近の取引</span>
            <span class="head-note"><span id="payMonthTotal"></span><button type="button" class="csv-btn" id="csvBtn">CSV出力</button></span>
          </div>
          <div class="recent-list" id="recentList"></div>
          <button type="button" class="recent-more" id="recentMore"></button>
        </div>
      </section>

      <!-- 分析 -->
      <section class="view view-analysis" id="viewAnalysis">

      var TRIP = { start: "2026-10-31", end: "2026-11-10", allowance: 43800 };
      var MONTHS = ["2026-10", "2026-11", "2026-12"];
      var cur = 1; // 2026-11
      var curMonthPays = [];

      function yen(n) { return n.toLocaleString("ja-JP"); }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function monthKey(dateStr) { return dateStr.slice(0, 7); }
      function inTrip(p) { return p.date >= TRIP.start && p.date <= TRIP.end; }
      function isBudgetCat(name) { return BUDGETS.some(function (b) { return b.name === name; }); }

      var tripStats = null;

      /* ---------- 出張カード（計算は従来どおり） ---------- */
      function renderTrip() {
        var food = 0, trans = 0;
        var foodDates = {}, lastFoodDate = null;
        PAYMENTS.forEach(function (p) {
          if (p.cat === "出張（食費）" && inTrip(p)) {
            food += p.amount;
            foodDates[p.date] = true;
            if (!lastFoodDate || p.date > lastFoodDate) lastFoodDate = p.date;
          }
          if (p.cat === "出張（交通・宿泊・燃料）") trans += p.amount;
        });
        var remain = TRIP.allowance - food;
        document.getElementById("tripRemain").textContent = yen(remain);
        document.getElementById("tripFood").textContent = yen(food);
        document.getElementById("tripTrans").textContent = yen(trans);
        var tripBar = document.getElementById("tripBar");
        var tpct = TRIP.allowance ? Math.min(100, food / TRIP.allowance * 100) : 0;
        tripBar.style.width = tpct + "%";
        tripBar.style.background = food > TRIP.allowance ? "var(--warn)" : "var(--trip)";
        // 食費の1日平均（食費の記録がある日数で割る）・残り日数・1日あたりの目安
        var foodDays = Object.keys(foodDates).length;
        var avg = foodDays ? Math.round(food / foodDays) : 0;
        var DAY = 86400000;
        function toTime(d) { var s = d.split("-"); return Date.UTC(+s[0], +s[1] - 1, +s[2]); }
        var ref = lastFoodDate || TRIP.start;
        var daysLeft = Math.max(0, Math.round((toTime(TRIP.end) - toTime(ref)) / DAY));
        var perDay = daysLeft > 0 ? Math.floor(remain / daysLeft) : remain;
        document.getElementById("tripAvg").textContent = yen(avg);
        document.getElementById("tripDaysLeft").textContent = daysLeft;
        document.getElementById("tripPerDay").textContent = yen(perDay);
        tripStats = { food: food, trans: trans, remain: remain, avg: avg, foodDays: foodDays, daysLeft: daysLeft, perDay: perDay };
      }

      /* ---------- ひとことアドバイス（最優先の1件だけを短く表示） ---------- */
      function buildAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct) {
        var items = [];
        function add(tone, text) {
          if (!items.length) items.push({ tone: tone, text: text });
        }
        // 予算超過の区分（超過額が大きい順）
        var overs = [];
        BUDGETS.forEach(function (b) {
          var rem = b.amount - (usedByCat[b.name] || 0);
          if (rem < 0) overs.push({ name: b.name, over: -rem });
        });
        overs.sort(function (a, b) { return b.over - a.over; });
        overs.forEach(function (o) {
          add("warn", o.name + "が予算を" + yen(o.over) + "円オーバー");
        });
        // 残りわずかの区分（残り率が小さい順）
        var lows = [];
        BUDGETS.forEach(function (b) {
          var used = usedByCat[b.name] || 0;
          var rem = b.amount - used;
          if (rem >= 0 && used > 0 && b.amount > 0 && rem <= b.amount * 0.2) {
            lows.push({ name: b.name, rem: rem, ratio: rem / b.amount });
          }
        });
        lows.sort(function (a, b) { return a.ratio - b.ratio; });
        lows.forEach(function (l) {
          add("low", l.name + "の残りは" + yen(l.rem) + "円だけ");
        });
        // 出張手当：残りと食費の1日平均から
        if (tripStats && tripStats.foodDays > 0) {
          if (tripStats.daysLeft > 0 && tripStats.avg > tripStats.perDay) {
            add("low", "出張の食費は平均" + yen(tripStats.avg) + "円/日・目安" + yen(tripStats.perDay) + "円超え");
          } else {
            add("good", "出張手当の残り" + yen(tripStats.remain) + "円・食費は目安内");
          }
        }
        // 今月の予算消化ペース（表示月が今月のときだけ）
        var now = new Date();
        var nowKey = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2);
        if (key === nowKey && totalUsed > 0) {
          var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
          var elapsedPct = Math.round(now.getDate() / daysInMonth * 1000) / 10;
          if (pct > elapsedPct + 10) {
            add("low", "使用率" + pct + "%・ペース速め（経過" + elapsedPct + "%）");
          } else if (pct <= elapsedPct) {
            add("good", "使用率" + pct + "%・予算内で順調");
          }
        }
        // 貯蓄の進捗
        var saveUsed = 0, saveGoal = 0;
        BUDGETS.forEach(function (b) {
          if (SAVE_NAMES.indexOf(b.name) >= 0) { saveUsed += usedByCat[b.name] || 0; saveGoal += b.amount; }
        });
        if (saveUsed > 0 && saveGoal > 0) {
          var sp = Math.round(saveUsed / saveGoal * 1000) / 10;
          add("good", "貯蓄" + yen(saveUsed) + "円（目標の" + sp + "%）");
        }
        // 前月より減らせた区分（一番減ったもの）
        var bestDown = null;
        BUDGETS.forEach(function (b) {
          var prev = prevUsedByCat[b.name] || 0;
          var diff = prev - (usedByCat[b.name] || 0);
          if (prev > 0 && diff > 0 && (!bestDown || diff > bestDown.diff)) bestDown = { name: b.name, diff: diff };
        });
        if (bestDown) {
          add("good", bestDown.name + "は前月より" + yen(bestDown.diff) + "円減");
        }
        // 該当なしのときの無難な一言
        if (!items.length) {
          if (totalUsed === 0) {
            items.push({ tone: "good", text: "今月はまだ目立った支出なし" });
          } else {
            items.push({ tone: "good", text: "予算内で順調です" });
          }
        }
        return items;
      }
      function renderAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct) {
        var it = buildAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct)[0];
        var card = document.getElementById("adviceCard");
        card.className = "card advice-card tone-" + it.tone;
        document.getElementById("adviceText").textContent = it.text;
      }

      /* ---------- 区分カードグリッド ---------- */
      function renderCats(usedByCat) {
        var grid = document.getElementById("catGrid");
        grid.innerHTML = BUDGETS.map(function (b) {
          var used = usedByCat[b.name] || 0;
          var rem = b.amount - used;
          var p = b.amount ? Math.round(used / b.amount * 1000) / 10 : 0;
          var isOver = rem < 0;
          var isLow = !isOver && used > 0 && b.amount > 0 && rem <= b.amount * 0.2;
          var barColor = isOver ? "var(--warn)" : (isLow ? "var(--low-bar)" : b.color);
          return '<div class="cat-card' + (isOver ? " over" : "") + (isLow ? " low" : "") + '">' +
            '<div class="cat-top"><span class="cat-ico" aria-hidden="true">' + iconFor(b.name) + '</span>' +
            '<span class="cat-name">' + esc(shortName(b.name)) + '</span>' +
            '<span class="cat-pct">' + p + '%</span></div>' +
            '<div class="cat-remain">' + yen(rem) + '<small>円</small></div>' +
            '<div class="bar"><i style="width:' + Math.min(100, p) + "%;background:" + barColor + '"></i></div></div>';
        }).join("");
      }

      /* ---------- ドーナツグラフ（分析） ---------- */
      function donutSlices(monthPays) {
        var byCat = {}, total = 0;
        monthPays.forEach(function (p) {
          byCat[p.cat] = (byCat[p.cat] || 0) + p.amount;
          total += p.amount;
        });
        var slices = Object.keys(byCat).map(function (name) {
          return { name: name, amount: byCat[name], color: CAT_COLORS[name] || "#68707c" };
        }).sort(function (a, b) { return b.amount - a.amount; });
        if (slices.length > 5) {
          var rest = slices.slice(4);
          var restAmt = rest.reduce(function (s, x) { return s + x.amount; }, 0);
          slices = slices.slice(0, 4);
          slices.push({ name: "その他", amount: restAmt, color: "#98a29b" });
        }
        return { slices: slices, total: total };
      }
      function donutHTML(monthPays) {
        var d = donutSlices(monthPays);
        if (!d.total) {
          return '<div class="empty">この月の支出はまだありません</div>';
        }
        var C = 2 * Math.PI * 40;
        var acc = 0, parts = "";
        d.slices.forEach(function (s) {
          var len = s.amount / d.total * C;
          var draw = d.slices.length > 1 ? Math.max(0, len - 1.8) : len;
          parts += '<circle cx="50" cy="50" r="40" fill="none" stroke="' + s.color + '" stroke-width="13" stroke-dasharray="' + draw.toFixed(2) + " " + (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 50 50)"/>';
          acc += len;
        });
        var svg = '<svg class="donut-svg" viewBox="0 0 100 100" aria-hidden="true">' +
          '<circle class="donut-track" cx="50" cy="50" r="40" fill="none" stroke-width="13"/>' + parts + "</svg>";
        var legend = d.slices.map(function (s) {
          var pct = Math.round(s.amount / d.total * 1000) / 10;
          var ico = CAT_ICONS[s.name]
            ? '<span class="legend-ico" aria-hidden="true">' + CAT_ICONS[s.name] + "</span>"
            : '<span class="dot" style="background:' + s.color + '"></span>';
          return '<div class="legend-row">' + ico +
            '<span class="legend-name">' + esc(s.name) + "</span>" +
            '<span class="legend-pct">' + pct + "%</span>" +
            '<span class="legend-amt">' + yen(s.amount) + "円</span></div>";
        }).join("");
        return '<div class="donut-wrap"><div class="donut-box">' + svg +
          '<div class="donut-center"><span class="c-label">合計</span><span class="c-value">' + yen(d.total) + "円</span></div></div>" +
          '<div class="donut-legend">' + legend + "</div></div>";
      }

      /* ---------- 最近の取引 ---------- */
      function recentCount() {
        if (window.matchMedia("(min-width: 900px)").matches) return 8;
        if (window.innerHeight >= 820) return 3;
        return 2;
      }
      function txRowHTML(p) {
        var color = CAT_COLORS[p.cat] || "#68707c";
        return '<div class="tx"><span class="tx-ico" style="background:' + color + '22" aria-hidden="true">' + iconFor(p.cat) + "</span>" +
          '<span class="tx-store">' + esc(p.store) + "</span>" +
          '<span class="tx-amount">' + yen(p.amount) + "円</span></div>";
      }
      function renderRecent() {
        var list = document.getElementById("recentList");
        var more = document.getElementById("recentMore");
        var monthTotal = curMonthPays.reduce(function (s, p) { return s + p.amount; }, 0);
        document.getElementById("payMonthTotal").textContent = curMonthPays.length ? "合計 " + yen(monthTotal) + "円 ・ " : "";
        if (!curMonthPays.length) {
          list.innerHTML = '<div class="empty">この月の支払いはまだありません</div>';
          more.style.display = "none";
          return;
        }
        var n = recentCount();
        list.innerHTML = curMonthPays.slice(0, n).map(txRowHTML).join("");
        var rest = curMonthPays.length - Math.min(n, curMonthPays.length);
        if (rest > 0) {
          more.style.display = "";
          more.textContent = "他 " + rest + " 件 ›";
        } else {
          more.style.display = "none";
        }
      }

      /* ---------- メインレンダリング ---------- */
      function render() {
        var key = MONTHS[cur];
        var y = key.slice(0, 4), m = parseInt(key.slice(5, 7), 10);
        document.getElementById("monthTitle").textContent = y + "年" + m + "月";
        document.getElementById("prevMonth").disabled = cur === 0;
        document.getElementById("nextMonth").disabled = cur === MONTHS.length - 1;

        var usedByCat = {};
        var pm = m - 1, py = y;
        if (pm < 1) { pm = 12; py = String(+y - 1); }
        var prevKey = py + "-" + ("0" + pm).slice(-2);
        var prevUsedByCat = {};
        var unknownUsed = 0;
        PAYMENTS.forEach(function (p) {
          if (!isBudgetCat(p.cat)) {
            // 区分不明の支払い（出張分を除く）も今月の使用額に含める
            if (p.cat !== "出張（食費）" && p.cat !== "出張（交通・宿泊・燃料）" && monthKey(p.date) === key) unknownUsed += p.amount;
            return;
          }
          if (monthKey(p.date) === key) usedByCat[p.cat] = (usedByCat[p.cat] || 0) + p.amount;
          if (monthKey(p.date) === prevKey) prevUsedByCat[p.cat] = (prevUsedByCat[p.cat] || 0) + p.amount;
        });
        var totalBudget = 0, totalUsed = unknownUsed;
        BUDGETS.forEach(function (b) { totalBudget += b.amount; totalUsed += usedByCat[b.name] || 0; });
        var remain = totalBudget - totalUsed;
        var pct = totalBudget ? Math.round(totalUsed / totalBudget * 1000) / 10 : 0;

        // ヒーロー（大きな数字＋円形リング）
        document.getElementById("heroLabel").textContent = m + "月あと使える";
        document.getElementById("heroRemain").textContent = yen(remain);
        document.getElementById("heroBig").classList.toggle("neg", remain < 0);
        document.getElementById("heroBudget").textContent = yen(totalBudget);
        document.getElementById("heroUsed").textContent = yen(totalUsed);
        document.getElementById("heroPct").textContent = pct;
        var RING_C = 226.2;
        var ring = document.getElementById("heroRing");
        var frac = totalBudget ? Math.min(1, totalUsed / totalBudget) : 0;
        ring.style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(1);
        ring.style.stroke = remain < 0 ? "var(--warn)" : "var(--accent)";

        // 表示月の支払い（新しい順）
        var monthPays = PAYMENTS.filter(function (p) { return monthKey(p.date) === key; });
        monthPays.sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return (b.time || "") < (a.time || "") ? -1 : 1;
        });
        curMonthPays = monthPays;

        // 区分カードグリッド
        renderCats(usedByCat);

        // ドーナツ（分析）
        document.getElementById("donutMonthA").textContent = m + "月の支出";
        document.getElementById("donutAnalysis").innerHTML = donutHTML(monthPays);

        // 分析：区分ごとの使用率バー＋前月比
        var list = document.getElementById("analysisList");
        list.innerHTML = "";
        BUDGETS.forEach(function (b) {
          var used = usedByCat[b.name] || 0;
          var rem = b.amount - used;
          var p = b.amount ? Math.round(used / b.amount * 1000) / 10 : 0;
          var isOver = rem < 0;
          var isLow = !isOver && b.amount > 0 && rem <= b.amount * 0.2;
          var diff = used - (prevUsedByCat[b.name] || 0);
          var diffCls = diff > 0 ? "up" : (diff < 0 ? "down" : "");
          var diffText = diff > 0 ? "▲" + yen(diff) : (diff < 0 ? "▼" + yen(-diff) : "±0");
          var barColor = isOver ? "var(--warn)" : (isLow ? "var(--low-bar)" : b.color);
          var row = document.createElement("div");
          row.className = "arow" + (isOver ? " over" : "") + (isLow ? " low" : "");
          row.innerHTML =
            '<div class="arow-top"><span class="arow-ico" aria-hidden="true">' + iconFor(b.name) + '</span>' +
            '<span class="arow-name">' + esc(shortName(b.name)) + '</span>' +
            '<span class="arow-pct">' + p + '%</span>' +
            '<span class="arow-diff ' + diffCls + '" title="前月比">' + diffText + '</span>' +
            '<span class="arow-remain">' + yen(rem) + "<small>円</small></span></div>" +
            '<div class="bar"><i style="width:' + Math.min(100, p) + "%;background:" + barColor + '"></i></div>';
          list.appendChild(row);
        });

        renderAdvice(key, usedByCat, prevUsedByCat, totalBudget, totalUsed, pct);
        renderRecent();
      }

      /* ---------- 全件オーバーレイ ---------- */
      function payItemHTML(p) {
        var color = CAT_COLORS[p.cat] || "#68707c";
        return '<div class="pay"><span class="tx-ico sm" style="background:' + color + '22" aria-hidden="true">' + iconFor(p.cat) + '</span>' +
          '<div class="pay-main"><div class="pay-line1">' +
          '<span class="pay-store">' + esc(p.store) + '</span>' +
          '<span class="pay-amount">' + yen(p.amount) + '円</span></div>' +
          '<div class="pay-line2">' +
          (p.note ? '<span class="pay-note">' + esc(p.note) + '</span>' : "") +
          '<span class="pay-sub">' + esc(p.cat) + " ・ " + esc(p.method) + (p.time ? " ・ " + esc(p.time) : "") + '</span>' +
          "</div></div></div>";
      }
      function groupedHTML(monthPays) {
        var days = {}, order = [];
        monthPays.forEach(function (p) {
          if (!days[p.date]) { days[p.date] = []; order.push(p.date); }
          days[p.date].push(p);
        });
        var week = ["日", "月", "火", "水", "木", "金", "土"];
        var html = "";
        order.forEach(function (d) {
          var items = days[d];
          var sum = items.reduce(function (s, p) { return s + p.amount; }, 0);
          var parts = d.split("-");
          var dt = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
          var head = parseInt(d.slice(5, 7), 10) + "月" + parseInt(d.slice(8, 10), 10) + "日（" + week[dt.getUTCDay()] + "）";
          html += '<div class="day-head"><span>' + head + '</span><span class="day-total">合計 ' + yen(sum) + "円</span></div>";
          items.forEach(function (p) { html += payItemHTML(p); });
        });
        return html;
      }

      var overlay = document.getElementById("overlay");
      var sheetQuery = "", sheetCat = "";
      function renderSheet() {
        var key = MONTHS[cur];
        var m = parseInt(key.slice(5, 7), 10);
        var q = sheetQuery.trim();
        var filtered = curMonthPays.filter(function (p) {
          if (sheetCat && p.cat !== sheetCat) return false;
          if (q && p.store.indexOf(q) < 0) return false;
          return true;
        });
        var total = filtered.reduce(function (s, p) { return s + p.amount; }, 0);
        var filtering = q || sheetCat;
        document.getElementById("sheetTitle").textContent =
          m + "月の支払い（" + (filtering ? filtered.length + "件／全" + curMonthPays.length + "件" : "全" + curMonthPays.length + "件") + "）";
        document.getElementById("sheetTotal").textContent = "合計 " + yen(total) + "円";
        document.getElementById("sheetBody").innerHTML = filtered.length
          ? groupedHTML(filtered)
          : '<div class="empty">条件に合う支払いはありません</div>';
        document.getElementById("sheetBody").scrollTop = 0;
      }
      function openOverlay() {
        if (!curMonthPays.length) return;
        var sel = document.getElementById("sheetFilter");
        var cats = [];
        curMonthPays.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
        sel.innerHTML = '<option value="">全ての区分</option>' + cats.map(function (c) {
          return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
        }).join("");
        sel.value = cats.indexOf(sheetCat) >= 0 ? sheetCat : "";
        sheetCat = sel.value;
        renderSheet();
        overlay.classList.add("open");
      }
      function closeOverlay() { overlay.classList.remove("open"); }
      document.getElementById("sheetSearch").addEventListener("input", function (e) {
        sheetQuery = e.target.value;
        renderSheet();
      });
      document.getElementById("sheetFilter").addEventListener("change", function (e) {
        sheetCat = e.target.value;
        renderSheet();
      });
      document.getElementById("recentCard").addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest("#csvBtn")) return;
        openOverlay();
      });
      document.getElementById("sheetClose").addEventListener("click", closeOverlay);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeOverlay(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });

      /* ---------- CSV出力 ---------- */
      function csvCell(v) {
        v = String(v == null ? "" : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }
      document.getElementById("csvBtn").addEventListener("click", function () {
        var key = MONTHS[cur];
        var rows = [["日付", "時刻", "店名", "金額", "メモ", "支払い方法", "区分"]];
        PAYMENTS.filter(function (p) { return monthKey(p.date) === key; }).forEach(function (p) {
          rows.push([p.date, p.time || "", p.store, p.amount, p.note || "", p.method, p.cat]);
        });
        var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
        var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "payments-" + key + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });

      /* ---------- 画面切り替え（ホーム／分析） ---------- */
      function setView(name) {
        var home = name === "home";
        document.getElementById("viewHome").classList.toggle("active", home);
        document.getElementById("viewAnalysis").classList.toggle("active", !home);
        document.getElementById("tabHome").classList.toggle("active", home);
        document.getElementById("tabAnalysis").classList.toggle("active", !home);
        document.getElementById("tabHome").setAttribute("aria-pressed", home ? "true" : "false");
        document.getElementById("tabAnalysis").setAttribute("aria-pressed", !home ? "true" : "false");
      }
      document.getElementById("tabHome").addEventListener("click", function () { setView("home"); });
      document.getElementById("tabAnalysis").addEventListener("click", function () { setView("analysis"); });

      /* ---------- 月切り替え ---------- */
      function changeMonth(d) {
        var n = cur + d;
        if (n < 0 || n >= MONTHS.length) return;
        cur = n;
        sheetQuery = ""; sheetCat = "";
        document.getElementById("sheetSearch").value = "";
        render();
      }
      document.getElementById("prevMonth").addEventListener("click", function () { changeMonth(-1); });
      document.getElementById("nextMonth").addEventListener("click", function () { changeMonth(1); });
      window.addEventListener("resize", renderRecent);

      renderTrip();
      render();
    </script>
  </body>
</html>
