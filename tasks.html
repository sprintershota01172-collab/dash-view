<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="tasks-icon.png" />
    <link rel="icon" type="image/png" href="tasks-icon.png" />
    <title>タスク管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f4f6f8;
        --surface:#ffffff;
        --ink:#16283f;
        --sub:#5b6b7f;
        --line:#d9e0e8;
        --divider:#e7ecf1;
        --teal:#0f766e;
        --teal-dark:#0b5a54;
        --teal-soft:#e7f3f1;
        --bar:#0f766e;
        --danger:#d92d20;
        --danger-dark:#b42318;
        --danger-bg:rgba(217,45,32,.08);
        --warn:#dc6803;
        --warn-dark:#b54708;
        --warn-bg:rgba(220,104,3,.09);
        --ring:#9db2c6;
        --today-bg:rgba(15,118,110,.10);
        --weekend-bg:rgba(22,40,63,.04);
        --holiday-bg:#dde3ea;
        --namew:54%;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0e1620;
          --surface:#16222f;
          --ink:#e9eff6;
          --sub:#9db0c2;
          --line:#2b3c4f;
          --divider:#22303f;
          --teal:#2fbfae;
          --teal-dark:#7fe0d2;
          --teal-soft:#123330;
          --bar:#1f9e8f;
          --danger:#ff6b61;
          --danger-dark:#ff8a80;
          --danger-bg:rgba(255,107,97,.14);
          --warn:#ffb020;
          --warn-dark:#ffcf6b;
          --warn-bg:rgba(255,176,32,.14);
          --ring:#54687e;
          --today-bg:rgba(47,191,174,.14);
          --weekend-bg:rgba(255,255,255,.04);
          --holiday-bg:rgba(255,255,255,.13);
        }
      }
      @media (min-width:900px){ :root{ --namew:330px } }
      *{box-sizing:border-box;touch-action:manipulation}
      html,body{height:100%}
      html{-webkit-text-size-adjust:100%}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        font-size:13px;line-height:1.4;
        -webkit-font-smoothing:antialiased;
      }
      .screen{
        position:relative;
        max-width:680px;margin:0 auto;
        height:100vh;height:100dvh;
        display:flex;flex-direction:column;
        padding:6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
      }
      @media (min-width:900px){ .screen{max-width:1080px;padding:8px 24px calc(8px + env(safe-area-inset-bottom, 0px))} }

      /* Header */
      header{display:flex;align-items:baseline;gap:8px;padding:0 2px}
      header h1{margin:0;font-size:13px;font-weight:700;line-height:1.25;flex:0 0 auto}
      .head-sub{flex:1 1 auto;min-width:0;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
      .head-sub .over{color:var(--danger-dark);font-weight:700}

      /* Progress summary (1行) */
      .progress{
        margin-top:4px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        display:flex;align-items:center;gap:6px;
      }
      .progress .pbar{flex:0 0 64px;height:4px;border-radius:2px;background:var(--divider);overflow:hidden}
      .progress .pbar i{display:block;height:100%;background:var(--teal)}
      .progress b{color:var(--ink);font-weight:700}
      .progress .over{color:var(--danger-dark);font-weight:700}
      .progress .over b{color:var(--danger-dark)}

      /* Filter chips + 完了切り替え（表示確認用） */
      .controls{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
      .chip{
        flex:0 0 auto;min-height:24px;padding:0 8px;border:1px solid var(--line);border-radius:5px;
        background:var(--surface);color:var(--sub);font:inherit;font-size:10.5px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;
      }
      .chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-soft);font-weight:700}
      .chip:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
      .controls .spacer{flex:1 1 auto}
      .chip.done-chip{border-style:dashed;margin-left:auto}

      /* Period nav */
      .periodnav{display:flex;align-items:center;gap:4px;margin-top:4px}
      .periodnav .rng{flex:1 1 auto;text-align:center;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .periodnav button{
        flex:0 0 auto;min-height:26px;padding:0 8px;border:1px solid var(--line);border-radius:5px;
        background:var(--surface);color:var(--ink);font:inherit;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;
      }
      .periodnav button.cur{color:var(--teal-dark);border-color:var(--teal);font-weight:700}
      .periodnav button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

      /* Legend（休日の凡例・1行） */
      .legend{margin-top:3px;font-size:9.5px;color:var(--sub);display:flex;align-items:center;gap:4px;line-height:1.3}
      .legend .lg-sw{flex:0 0 auto;width:10px;height:10px;background:var(--holiday-bg);border:1px solid var(--line);border-radius:2px}

      /* Main */
      main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:4px;overflow-y:auto}

      /* ---------- Gantt ---------- */
      .gantt{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;overflow-x:auto;overflow-y:hidden;flex:0 0 auto}
      .g-head{display:flex;border-bottom:1px solid var(--line);background:var(--surface)}
      .g-name{flex:0 0 var(--namew);min-width:0;display:flex;align-items:center}
      .g-head .g-name{padding:0 8px;font-size:10.5px;font-weight:600;color:var(--sub);height:24px;border-right:1px solid var(--line)}
      .g-track{flex:1 1 auto;min-width:0;position:relative}
      .g-days{display:flex;height:24px}
      .g-day{
        flex:1 1 0;min-width:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2px;
        font-variant-numeric:tabular-nums;line-height:1;
      }
      .g-day .dn{font-size:11px;font-weight:600}
      .g-day .dw{font-size:9px;color:var(--sub)}
      .g-day.today{background:var(--today-bg)}
      .g-day.today .dn{color:var(--teal-dark);font-weight:700}
      .g-day.today .dw{color:var(--teal-dark)}
      .g-day.hol{background:var(--holiday-bg)}
      .g-day.today.hol{box-shadow:inset 0 0 0 2px var(--teal)}
      .g-row{display:flex;height:30px;position:relative;cursor:pointer}
      .g-row + .g-row{border-top:1px solid var(--divider)}
      .g-row .g-name{border-right:1px solid var(--line)}
      .g-row.is-done{opacity:.55}
      /* 警告強調：左端バー＋背景 */
      .g-row.is-over{background:var(--danger-bg)}
      .g-row.is-over::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--danger);z-index:3}
      .g-row.is-todaydue{background:var(--danger-bg)}
      .g-row.is-todaydue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--danger);z-index:3}
      .g-row.is-tomorrow{background:var(--warn-bg)}
      .g-row.is-tomorrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn);z-index:3}
      .g-namebody{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:5px;padding:0 6px 0 8px}
      .g-row.is-over .g-namebody,.g-row.is-todaydue .g-namebody{padding-left:10px}
      .g-tname{
        flex:1 1 auto;min-width:0;
        font-size:8px;font-weight:500;line-height:1.3;color:var(--ink);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      }
      .g-row.is-top .g-tname{font-weight:600}
      .g-row.is-done .g-tname{text-decoration:line-through;color:var(--sub)}
      .g-row.is-over .g-tname{color:var(--danger-dark);font-weight:700}
      .g-row.is-todaydue .g-tname{color:var(--danger-dark);font-weight:700}
      .g-row.is-tomorrow .g-tname{color:var(--warn-dark);font-weight:700}
      .g-row .pri-dot{flex:0 0 auto;font-size:9.5px;font-weight:700;color:var(--teal-dark);white-space:nowrap;line-height:1}
      .g-row.is-over .pri-dot,.g-row.is-todaydue .pri-dot{color:var(--danger-dark)}
      .g-due-inline{flex:0 0 auto;font-size:10px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.25}
      .g-due-inline.over{color:var(--danger-dark);font-weight:700}
      .g-due-inline.todaydue{color:var(--danger-dark);font-weight:700}
      .g-due-inline.tomorrow{color:var(--warn-dark);font-weight:700}
      .g-track .grid{position:absolute;inset:0}
      .g-track .shade{position:absolute;top:0;bottom:0}
      .g-bar{
        position:absolute;top:50%;transform:translateY(-50%);height:13px;border-radius:3px;
        background:var(--bar);cursor:pointer;min-width:7px;
        display:flex;align-items:center;justify-content:space-between;
        color:#fff;font-size:10px;line-height:1;padding:0 1px;
      }
      .g-bar.done-bar{background:var(--ring)}
      .g-bar.bar-over{background:var(--danger)}
      .g-bar.bar-todaydue{background:var(--danger)}
      .g-bar.bar-tomorrow{background:var(--warn)}
      .g-bar .cont{font-weight:700;opacity:.95}
      .g-due{
        position:absolute;top:50%;width:11px;height:11px;border-radius:2px;
        transform:translate(-50%,-50%) rotate(45deg);cursor:pointer;
        background:var(--ink);
      }
      .g-due.tent{background:var(--surface);border:2px solid var(--teal)}
      .g-due.over{background:var(--danger);width:13px;height:13px;box-shadow:0 0 0 2px var(--danger-bg)}
      .g-due.todaydue{background:var(--danger);width:13px;height:13px;box-shadow:0 0 0 2px var(--danger-bg)}
      .g-due.tomorrow{background:var(--warn);width:12px;height:12px}
      .g-due.tent.over{background:var(--danger-bg);border-color:var(--danger)}
      .g-due.tent.todaydue{background:var(--danger-bg);border-color:var(--danger)}
      .g-due.tent.tomorrow{background:var(--warn-bg);border-color:var(--warn)}
      .g-due.sameday{box-shadow:0 0 0 2px var(--surface)}
      .g-due.over.sameday,.g-due.todaydue.sameday{box-shadow:0 0 0 2px var(--danger-bg)}

      .empty{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 16px;text-align:center;flex:0 0 auto}
      .empty .msg{font-size:13px;font-weight:600}
      .empty .sub-msg{margin-top:4px;font-size:11px;color:var(--sub)}

      /* Pager（20件超のときだけ表示） */
      .pager{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:6px}
      .pager[hidden]{display:none}
      .pager button{min-width:84px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:500;cursor:pointer}
      .pager button:disabled{color:var(--sub);opacity:.45;cursor:default}
      .pager button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
      .pager .page-info{flex:1 1 auto;text-align:center;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}

      /* Detail sheet（閲覧専用） */
      .overlay{position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
      .overlay.show{display:flex}
      .sheet{
        width:100%;max-width:680px;max-height:92dvh;overflow-y:auto;
        background:var(--surface);color:var(--ink);
        border-radius:10px 10px 0 0;
        padding:16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
        animation:sheetIn .16s ease;
      }
      @media (min-width:900px){ .sheet{max-width:560px} .overlay{align-items:center;padding:24px} .sheet{border-radius:10px} }
      @keyframes sheetIn{from{transform:translateY(10px);opacity:.5}to{transform:none;opacity:1}}
      .sheet h2{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--sub)}
      .sheet .full-name{font-size:14px;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
      .sheet .short-name{margin-top:4px;font-size:12px;color:var(--sub)}
      .sheet .short-name .k{color:var(--sub)}
      .sheet .meta{margin-top:10px;font-size:12px;line-height:1.9;font-variant-numeric:tabular-nums}
      .sheet .meta .k{color:var(--sub)}
      .sheet .meta .over{color:var(--danger-dark);font-weight:700}
      .sheet .meta .todaydue{color:var(--danger-dark);font-weight:700}
      .sheet .meta .tomorrow{color:var(--warn-dark);font-weight:700}
      .sheet .meta .pri{color:var(--teal-dark);font-weight:600}
      .tag-tent{display:inline-block;font-size:10px;font-weight:600;color:var(--teal-dark);border:1px solid var(--teal);border-radius:4px;padding:0 5px;line-height:1.7;vertical-align:1px}
      .sheet-actions{margin-top:20px}
      .sheet-actions button{width:100%;min-height:48px;border-radius:6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
      .sheet-actions button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

      /* Mid widths: short display names leave room for a readable date axis */
      @media (min-width:561px) and (max-width:899px){ :root{ --namew:56% } }
      /* Phones (390px target): task names are short display names at 8px. The
         name column is a fixed 198px so a 12-character display name fits on
         one line next to the "優" mark and the shortened due label without
         ellipsis; the time axis keeps at least 30px per day (axis >= 210px).
         When the screen is too narrow for 198px + 210px = 408px, the axis
         scrolls sideways while the name column stays pinned (sticky) so
         names never scroll away.
         Full formal names live in the detail sheet.
         The priority label compacts to a single "優" mark on phones. */
      @media (max-width:560px){
        :root{ --namew:198px }
        .g-head,.g-row{min-width:calc(var(--namew) + 210px)}
        .g-name{position:sticky;left:0;z-index:4;background:var(--surface)}
        .g-head .g-name{z-index:6}
        .g-row.is-over .g-name,.g-row.is-todaydue .g-name{background:var(--surface);background:color-mix(in srgb, var(--danger) 8%, var(--surface));box-shadow:inset 4px 0 0 var(--danger)}
        .g-row.is-tomorrow .g-name{background:var(--surface);background:color-mix(in srgb, var(--warn) 9%, var(--surface));box-shadow:inset 3px 0 0 var(--warn)}
        .g-day{flex-direction:column;gap:1px}
        .g-day .dn{font-size:10px}
        .g-day .dw{font-size:7.5px}
        .g-namebody{gap:3px;padding:0 3px 0 5px}
        .g-tname{font-size:8px}
        .g-due-inline{font-size:9px}
        .g-row .pri-dot{font-size:0;line-height:1}
        .g-row .pri-dot::after{content:"優";font-size:9px;font-weight:700}
      }
      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation:none !important;transition:none !important}
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header>
        <h1 id="todayLabel"></h1>
        <div class="head-sub" id="headSub"></div>
      </header>

      <div class="progress" id="progress" aria-label="進捗サマリー"></div>

      <div class="controls" id="controls">
        <button type="button" class="chip" data-cat="all" aria-pressed="true">すべて</button>
        <button type="button" class="chip" data-cat="work" aria-pressed="false">仕事</button>
        <button type="button" class="chip" data-cat="private" aria-pressed="false">プライベート</button>
        <button type="button" class="chip" data-cat="unplanned" aria-pressed="false" id="unplannedChip"></button>
        <span class="spacer"></span>
        <button type="button" class="chip done-chip" id="doneChip" aria-pressed="false"></button>
      </div>

      <div class="periodnav" id="periodNav"></div>

      <div class="legend"><span class="lg-sw" aria-hidden="true"></span>灰色＝休日（仕事不可）</div>

      <main id="main"></main>

      <div class="pager" id="pager">
        <button type="button" id="prevBtn">← 前へ</button>
        <div class="page-info" id="pageInfo"></div>
        <button type="button" id="nextBtn">次へ →</button>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="タスク詳細"></div>
    </div>

    <script>
      // 2026-11-02 時点の記録（~/workspace/work/tasks.md より）。名称・締切・仮期限・最優先は元のまま。
      // name = 正式名称（詳細表示で全文を確認できる）。short = ガント表示用の短い表示名。
      // plan = 実施予定日、planEnd = 実施期間の終了日（任意）。既存タスクに期間データは無いため planEnd は全て未設定。
      // 締切だけのタスクはガント上で締切日の◆マーカーとして表示する。実施予定と締切は別管理。
      // このアプリは閲覧専用。追加・編集・完了の管理はチャット経由で行う。

        { id: "695d-ceil-delivery", cat: "work", name: "695D TB天井基材の納期に関する問い合わせ（理由・最短納期）", short: "天井基材の納期問い合わせ", due: "2026-11-03", tentative: true, must: true, done: true, plan: "2026-11-03", memo: "特急。先方から納期に間に合わないと言われたため、理由と最短納期を問い合わせる。担当者は未確認" },
        { id: "trial-check",   cat: "work",    name: "工程検証トライチェックシートの作成", short: "工程検証トライシート作成", due: "2026-11-03", must: true, done: true, plan: "__TODAY__" },
        { id: "intern-1103",   cat: "work",    name: "インターン対応（工程見学・座談会）", short: "インターン対応", due: "2026-11-23", plan: "2026-11-23", memo: "11/23 工程見学→座談会（座談会 15:10〜16:30／工程見学はその前、開始時刻未確認）" },
        { id: "funakoshi-ship",cat: "work",    name: "舩越さんに臨時便に机上の天井機材を載せてもらう依頼", short: "舩越さんへ積載依頼", due: "2026-11-04", tentative: true, must: true, done: true, plan: "2026-11-04" },
        { id: "lift-request",  cat: "work",    name: "試作管理表に、リフトの操作依頼を書く", short: "試作管理表へ操作依頼", due: "2026-11-04", tentative: true, must: true, done: true, plan: "2026-11-04" },
        { id: "fire-insurance",cat: "private", name: "火災保険料がいま幾らか調べる", short: "火災保険料の確認", due: "2026-11-06", tentative: true, done: true, plan: null, memo: "確認済み：火災保険料は2年で18,000円（年額換算9,000円）" },
        { id: "pet-brkt",      cat: "work",    name: "PET BRKTで接着性確認", short: "PET BRKT接着確認", due: "2026-11-08", plan: null },
        { id: "hm-measure",    cat: "work",    name: "HM板厚ばらつき測定", short: "HM板厚測定", due: "2026-11-09", tentative: true, plan: null },
        { id: "cooler",        cat: "work",    name: "クーラー管理シートの貼り付けと課内への周知", short: "クーラー管理シート掲示", due: "2026-11-11", assumed: true, plan: "2026-11-11" },
        { id: "695-check",     cat: "work",    name: "695試作品チェックシート", short: "695試作チェックシート", due: "2026-11-12", plan: "2026-11-11" },
        { id: "sf-eval",       cat: "work",    name: "SuccessFactors年間評価（能力発揮時期評価）の提出", short: "年間評価の提出", due: "2026-11-13", plan: "2026-11-09", memo: "11/9夜までに仕上げる前倒し目標" },
        { id: "fmea-fix",      cat: "work",    name: "量産FMEA修正", short: "量産FMEA修正", due: "2026-11-16", tentative: true, plan: "2026-11-13" },
        { id: "harness-pay",   cat: "work",    name: "ハーネス高所作業者教育の振り込み", short: "ハーネス教育の振込", due: "2026-11-17", plan: "2026-11-13" },
        { id: "695-make",      cat: "work",    name: "695試作品作製", short: "695試作品作製", due: "2026-11-17", plan: "2026-11-16" },
        { id: "hiyari-proposal",cat: "work",   name: "ヒヤリハット提案事例", short: "ヒヤリハット提案事例", due: "2026-11-18", plan: "2026-11-16", planEnd: "2026-11-17" },
        { id: "695-parts-rain",cat: "work",    name: "695 製造部品表にレインセンサ対象を明記", short: "部品表レインセンサ明記", due: "2026-11-05", tentative: true, plan: "2026-11-05" },
        { id: "eguchi-980",    cat: "work",    name: "江口さんへ980のデータを送る", short: "980データ送付", due: "2026-11-02", done: true, plan: null },
        { id: "889-lamp-address", cat: "work", name: "889トライ材料にランプアドレスを貼る", short: "889ランプアドレス貼付", due: "2026-11-06", plan: "2026-11-05" },
        { id: "889-special-char-check", cat: "work", name: "889特殊特性チェックシート4点照合", short: "889特殊特性4点照合", due: "2026-11-06", plan: "2026-11-05" },
        { id: "889-product-eval-report", cat: "work", name: "889製品評価報告書作成", short: "889製品評価報告書", due: "2026-11-20", tentative: true, plan: "2026-11-19" },
        { id: "980se-drawing-check", cat: "work", name: "980SE図データ確認", short: "980SE図データ確認", due: "2026-11-06", tentative: true, plan: "2026-11-06" },
        { id: "889-backup-process-check", cat: "work", name: "889バックアップ工程動作確認", short: "889バックアップ動作確認", due: "2026-11-13", tentative: true, plan: "2026-11-09", planEnd: "2026-11-12", memo: "実施計画を立てる（期限は秘書割当の仮期限）" },
        { id: "889-all-parts-check", cat: "work", name: "889全システム全品番確認", short: "889全品番確認", due: "2026-11-20", tentative: true, plan: "2026-11-16", planEnd: "2026-11-19", memo: "実施計画を立てる（期限は秘書割当の仮期限）" },
        { id: "common-jig-ra", cat: "work", name: "全車種共通治具 作業RA", short: "共通治具の作業RA", due: "2026-11-30", plan: "2026-11-26" },
        { id: "common-jig-fmea", cat: "work", name: "全車種共通治具 FMEA", short: "共通治具のFMEA", due: "2026-11-30", plan: "2026-11-27" },
        { id: "gantt-maint",   cat: "work",    name: "ガナートメンテ", short: "ガナートメンテ", due: "2026-12-02", plan: "2026-11-18", planEnd: "2026-11-25", memo: "ガナートは生準（生産準備）の日程表。納期は12/2（水）午前、調整は納期の1〜2週間前まで" },
        { id: "sensor-replace-1106", cat: "work", name: "センサを変える", short: "センサ交換", due: "2026-11-06", plan: "2026-11-06", memo: "11/6の昼休憩に実施" },
        { id: "889-peeling-qc-meeting", cat: "work", name: "889恒温槽での剥がれについて品管と話し合う", short: "889恒温槽剥がれ協議", due: "2026-11-06", tentative: true, must: true, plan: "2026-11-05", memo: "品管との話し合いのため最優先。期限は秘書割当の仮期限" },
        { id: "889-quality-relaxation-inquiry", cat: "work", name: "889品質緩和要望進捗問い合わせ", short: "889品質緩和進捗確認", due: "2026-11-06", tentative: true, must: true, plan: "2026-11-05", memo: "人への進捗問い合わせのため最優先。期限は秘書割当の仮期限" },
        { id: "wedding-chief-request", cat: "private", name: "結婚式の主賓をお願いする", short: "結婚式の主賓依頼", due: "2026-11-20", tentative: true, must: true, plan: "2026-11-17", memo: "人へのお願いのため最優先。期限は仮期限" }
      ];
      TASKS.forEach(function(t){
        if(t.planEnd === undefined) t.planEnd = null;
        if(t.memo === undefined) t.memo = "";
      });

      // 追加休日（振休・有休など、土日以外に仕事不可とする日）を "YYYY-MM-DD" で列挙する。
      // 土日は自動判定するのでここには不要。初期値は空＝土日のみ休日扱い。
      var HOLIDAYS = [];

      var WD = ["日","月","火","水","木","金","土"];
      var state = { cat: "all", showDone: false, page: 0, weekOff: 0, monthOff: 0 };

      function pad(n){ return (n<10?"0":"")+n; }
      function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
      function todayLocal(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
      function todayStr(){ return fmtDate(todayLocal()); }
      function addDaysStr(s, n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return fmtDate(d); }
      function parseDue(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
      function daysLeft(s){ if(!s) return null; return Math.round((parseDue(s)-todayLocal())/86400000); }
      function dayDiff(a, b){ return Math.round((parseDue(a)-parseDue(b))/86400000); } // a-b 日数
      function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
      function findTask(id){ for(var i=0;i<TASKS.length;i++){ if(TASKS[i].id===id) return TASKS[i]; } return null; }
      function displayName(t){ return t.short || t.name; }
      function isTentative(t){ return !!(t.tentative || t.assumed); }
      // 休日判定：土日は自動、平日は HOLIDAYS リストにあれば休日（仕事不可）
      function isHoliday(s){
        var g = parseDue(s).getDay();
        if(g === 0 || g === 6) return true;
        return HOLIDAYS.indexOf(s) >= 0;
      }
      function isWide(){ return window.innerWidth >= 900; }

      TASKS.forEach(function(t){ if(t.plan === "__TODAY__") t.plan = todayStr(); });
      (function(){
        var open = TASKS.filter(function(t){ return !t.done; }).slice();
        open.sort(function(a,b){
          if(!!a.must !== !!b.must) return a.must ? -1 : 1;
          var da = a.due || "9999", db = b.due || "9999";
          return da<db ? -1 : da>db ? 1 : 0;
        });
        open.forEach(function(t,i){ t.ord = i; });
        TASKS.forEach(function(t){ if(t.ord == null) t.ord = 999; });
      })();

      /* ---------- Labels（1行に収まる短い表記） ---------- */
      function dueLabel(t){
        if(!t.due) return { text: "期限なし", cls: "" };
        var d = daysLeft(t.due);
        var dt = parseDue(t.due);
        var md = (dt.getMonth()+1)+"/"+dt.getDate();
        if(d < 0) return { text: Math.abs(d)+"日超過", cls: "over" };
        if(d === 0) return { text: "今日まで", cls: "soon" };
        if(d === 1) return { text: "明日まで", cls: "soon" };
        return { text: md+"まで", cls: "" };
      }
      // 警告区分：over=期限超過 / todaydue=今日締切 / tomorrow=明日締切 / それ以外は通常
      function urgency(t){
        if(t.done || !t.due) return "";
        var d = daysLeft(t.due);
        if(d === null) return "";
        if(d < 0) return "over";
        if(d === 0) return "todaydue";
        if(d === 1) return "tomorrow";
        return "";
      }
      // 名前と同じ1行に収める短い締切表記（例：11/2超過・11/3今日・11/4明日・11/12／目安は末尾に付く）。
      // 12文字の表示名が省略されないよう「・今日まで」等は詰めた形にし、全文は詳細画面の表記で確認できる。
      function dueInline(t){
        if(t.done) return { text: "完了", cls: "" };
        if(!t.due) return { text: "期限なし", cls: "" };
        var d = daysLeft(t.due);
        var dt = parseDue(t.due);
        var md = (dt.getMonth()+1)+"/"+dt.getDate();
        var tent = isTentative(t) ? "目安" : "";
        if(d < 0) return { text: md+"超過", cls: "over" };
        if(d === 0) return { text: md+"今日", cls: "todaydue" };
        if(d === 1) return { text: md+"明日", cls: "tomorrow" };
        return { text: md + tent, cls: "" };
      }
      function dateFull(s){
        if(!s) return "未設定";
        var dt = parseDue(s);
        return (dt.getMonth()+1)+"/"+dt.getDate()+"（"+WD[dt.getDay()]+"）";
      }

      /* ---------- Filtering ---------- */
      function viewTasks(){
        var list = TASKS.filter(function(t){ return state.showDone ? !!t.done : !t.done; });
        if(state.cat === "work" || state.cat === "private")
          list = list.filter(function(t){ return t.cat === state.cat; });
        if(state.cat === "unplanned")
          list = list.filter(function(t){ return !t.plan; });
        if(state.showDone){
          list.sort(function(a,b){
            var da = a.due || "9999-99", db = b.due || "9999-99";
            return da<db ? -1 : da>db ? 1 : 0;
          });
        } else {
          list.sort(function(a,b){ return a.ord - b.ord; });
        }
        return list;
      }
      function unplannedCount(){
        return TASKS.filter(function(t){ return !t.done && !t.plan; }).length;
      }

      /* ---------- Gantt range ---------- */
      function ganttRange(){
        var t = todayLocal();
        if(isWide()){
          var first = new Date(t.getFullYear(), t.getMonth() + state.monthOff, 1);
          var days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
          return { start: fmtDate(first), days: days, mode: "month" };
        }
        var monday = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay()+6)%7) + state.weekOff*7);
        return { start: fmtDate(monday), days: 7, mode: "week" };
      }
      function rangeLabel(r){
        var s = parseDue(r.start), e = parseDue(addDaysStr(r.start, r.days-1));
        if(r.mode === "month") return s.getFullYear()+"年"+(s.getMonth()+1)+"月";
        return (s.getMonth()+1)+"/"+s.getDate()+"（"+WD[s.getDay()]+"）〜"+(e.getMonth()+1)+"/"+e.getDate()+"（"+WD[e.getDay()]+"）";
      }

      function pageSize(){
        return 20; // 1画面に縦20件（行高30px＋ヘッダー22pxで収める）
      }

      /* ---------- Gantt rendering ---------- */
      function ganttHtml(pageItems, r){
        var n = r.days, ts = todayStr();
        var head = '<div class="g-head"><div class="g-name">タスク</div><div class="g-track"><div class="g-days">';
        for(var i=0;i<n;i++){
          var ds = addDaysStr(r.start, i), dt = parseDue(ds);
          var cls = "g-day" + (ds === ts ? " today" : "") + (isHoliday(ds) ? " hol" : "");
          head += '<div class="'+cls+'"><span class="dn">'+dt.getDate()+'</span><span class="dw">'+WD[dt.getDay()]+'</span></div>';
        }
        head += '</div></div></div>';

        var rows = pageItems.map(function(t, idx){
          var shades = "";
          for(var i=0;i<n;i++){
            var ds2 = addDaysStr(r.start, i);
            var hol2 = isHoliday(ds2), isToday2 = ds2 === ts;
            var st = "";
            if(hol2) st = "background:var(--holiday-bg)";
            else if(isToday2) st = "background:var(--today-bg)";
            // 今日が休日のときは、灰色の上に今日の位置が分かるよう左右に青緑の線を引く
            if(isToday2 && hol2) st += ";box-shadow:inset 2px 0 0 var(--teal),inset -2px 0 0 var(--teal)";
            if(st) shades += '<div class="shade" style="left:'+(i*100/n)+'%;width:'+(100/n)+'%;'+st+'"></div>';
          }
          var grid = '<div class="grid" style="background-image:linear-gradient(to right, var(--divider) 1px, transparent 1px);background-size:'+(100/n)+'% 100%"></div>';

          var urg = urgency(t);
          // 実施期間バー（実施予定日〜終了日。終了日未設定なら1日分）
          var bar = "";
          if(t.plan){
            var sIdx = dayDiff(t.plan, r.start);
            var eIdx = dayDiff(t.planEnd || t.plan, r.start);
            if(eIdx >= 0 && sIdx <= n-1){
              var cs = Math.max(0, sIdx), ce = Math.min(n-1, eIdx);
              bar = '<div class="g-bar'+(t.done ? " done-bar" : "")+(urg ? " bar-"+urg : "")+'" '
                + 'style="left:calc('+(cs*100/n)+'% + 1px);width:calc('+((ce-cs+1)*100/n)+'% - 2px)">'
                + (sIdx < 0 ? '<span class="cont">‹</span>' : '<span></span>')
                + (eIdx > n-1 ? '<span class="cont">›</span>' : '<span></span>')
                + '</div>';
            }
          }
          // 締切◆マーカー
          var marker = "";
          if(t.due){
            var dIdx = dayDiff(t.due, r.start);
            if(dIdx >= 0 && dIdx <= n-1){
              var mc = "g-due" + (urg ? " "+urg : "") + (isTentative(t) ? " tent" : "") + (t.plan === t.due ? " sameday" : "");
              marker = '<div class="'+mc+'" '
                + 'style="left:'+((dIdx+0.5)*100/n)+'%"></div>';
            }
          }
          var di = dueInline(t);
          var rowCls = "g-row" + (!t.done && idx===0 ? " is-top" : "") + (t.done ? " is-done" : "") + (urg ? " is-"+urg : "");
          return '<div class="'+rowCls+'" data-id="'+esc(t.id)+'" data-act="detail" role="button" tabindex="0" aria-label="詳細を見る：'+esc(t.name)+'">'
            + '<div class="g-name"><div class="g-namebody">'
            + (t.must && !t.done ? '<span class="pri-dot">最優先</span>' : '')
            + '<span class="g-tname">'+esc(displayName(t))+'</span>'
            + '<span class="g-due-inline'+(di.cls ? " "+di.cls : "")+'">'+esc(di.text)+'</span>'
            + '</div></div>'
            + '<div class="g-track">' + shades + grid + bar + marker + '</div>'
            + '</div>';
        }).join("");

        return '<section class="gantt" aria-label="ガントチャート">' + head + rows + '</section>';
      }

      /* ---------- Render ---------- */
      function render(){
        var ts = todayStr();
        var open = TASKS.filter(function(t){ return !t.done; });
        var done = TASKS.filter(function(t){ return t.done; });
        var todayCount = open.filter(function(t){ return t.plan === ts; }).length;
        var overCount = open.filter(function(t){ var d = daysLeft(t.due); return d !== null && d < 0; }).length;

        document.getElementById("headSub").innerHTML =
          "今日 " + todayCount + "件 ・ 未完了 " + open.length + "件"
          + (overCount ? ' ・ <span class="over">期限超過 ' + overCount + '件</span>' : "");

        var totalAll = TASKS.length;
        var pct = totalAll ? Math.round(done.length / totalAll * 100) : 0;
        var weekCount = open.filter(function(t){ var d = daysLeft(t.due); return d !== null && d >= 0 && d <= 7; }).length;
        document.getElementById("progress").innerHTML =
          '<span class="pbar" aria-hidden="true"><i style="width:' + pct + '%"></i></span>'
          + '<span>進捗 <b>' + pct + '%</b></span><span>・</span>'
          + (overCount ? '<span class="over">遅れ <b>' + overCount + '件</b></span>' : '<span>遅れ <b>0件</b></span>')
          + '<span>・</span><span>7日以内 <b>' + weekCount + '件</b></span>'
          + '<span>・</span><span>完了 <b>' + done.length + '/' + totalAll + '件</b></span>';

        var chips = document.querySelectorAll(".chip[data-cat]");
        for(var j=0;j<chips.length;j++){
          chips[j].setAttribute("aria-pressed", chips[j].getAttribute("data-cat") === state.cat ? "true" : "false");
        }
        document.getElementById("unplannedChip").textContent = "未計画 " + unplannedCount();
        var doneChip = document.getElementById("doneChip");
        doneChip.textContent = "完了 " + done.length;
        doneChip.setAttribute("aria-pressed", state.showDone ? "true" : "false");

        // 期間ナビ
        var pnav = document.getElementById("periodNav");
        var r0 = ganttRange();
        var unit = r0.mode === "month" ? "月" : "週";
        var off = r0.mode === "month" ? state.monthOff : state.weekOff;
        pnav.innerHTML =
          '<button type="button" id="pPrev">‹ 前の' + unit + '</button>'
          + '<button type="button" id="pCur" class="' + (off === 0 ? "cur" : "") + '">今' + unit + '</button>'
          + '<span class="rng">' + esc(rangeLabel(r0)) + '</span>'
          + '<button type="button" id="pNext">次の' + unit + ' ›</button>';
        document.getElementById("pPrev").addEventListener("click", function(){ shiftRange(-1); });
        document.getElementById("pNext").addEventListener("click", function(){ shiftRange(1); });
        document.getElementById("pCur").addEventListener("click", function(){ state.weekOff = 0; state.monthOff = 0; state.page = 0; render(); });

        var main = document.getElementById("main");
        var list = viewTasks();
        var ps = pageSize();
        var totalPages = Math.max(1, Math.ceil(list.length / ps));
        var page = state.page;
        if(page > totalPages - 1) page = totalPages - 1;
        if(page < 0) page = 0;
        state.page = page;
        var start = page * ps;
        var pageItems = list.slice(start, start + ps);

        if(!list.length){
          main.innerHTML = '<section class="empty"><div class="msg">'
            + (state.showDone ? "完了したタスクはありません" : "表示するタスクはありません")
            + '</div></section>';
        } else {
          main.innerHTML = ganttHtml(pageItems, r0);
        }

        var pagerEl = document.getElementById("pager");
        pagerEl.hidden = totalPages <= 1;
        var info = document.getElementById("pageInfo");
        if(list.length){
          info.textContent = (start+1) + "〜" + (start + pageItems.length) + "件／全" + list.length + "件"
            + (totalPages > 1 ? "（" + (page+1) + "/" + totalPages + "ページ）" : "");
        } else {
          info.textContent = "全0件";
        }
        document.getElementById("prevBtn").disabled = page <= 0;
        document.getElementById("nextBtn").disabled = page >= totalPages - 1;
      }
      function shiftRange(d){
        if(isWide()) state.monthOff += d; else state.weekOff += d;
        state.page = 0;
        render();
      }

      /* ---------- Detail sheet（閲覧専用） ---------- */
      var overlay = document.getElementById("overlay");
      var sheet = document.getElementById("sheet");
      function openDetail(t){
        var seg = dueLabel(t);
        var urg = urgency(t);
        var dueTxt = "未設定";
        if(t.due){
          var inner = dateFull(t.due) + "（" + seg.text + "）";
          dueTxt = urg ? '<span class="'+urg+'">' + esc(inner) + '</span>' : esc(inner);
          if(isTentative(t)) dueTxt += ' <span class="tag-tent">目安</span>';
        }
        var planTxt = "未設定（未計画）";
        if(t.plan){
          planTxt = dateFull(t.plan);
          if(t.planEnd && t.planEnd !== t.plan) planTxt += " 〜 " + dateFull(t.planEnd);
        }
        var html = '<h2>タスク詳細</h2>'
          + '<div class="full-name">' + esc(t.name) + '</div>'
          + (displayName(t) !== t.name ? '<div class="short-name"><span class="k">表示名：</span>' + esc(displayName(t)) + '</div>' : '')
          + '<div class="meta">'
          + '<span class="k">区分：</span>' + (t.cat === "work" ? "仕事" : "プライベート")
          + (t.must && !t.done ? ' ・ <span class="pri">最優先</span>' : "")
          + '<br /><span class="k">状態：</span>' + (t.done ? "完了" : "未完了")
          + '<br /><span class="k">締切：</span>' + dueTxt
          + '<br /><span class="k">実施予定：</span>' + planTxt
          + (t.memo ? '<br /><span class="k">メモ：</span>' + esc(t.memo) : "")
          + '</div>'
          + '<div class="sheet-actions"><button type="button" id="sheetClose">閉じる</button></div>';
        sheet.innerHTML = html;
        overlay.classList.add("show");
        document.getElementById("sheetClose").addEventListener("click", closeSheet);
      }
      function closeSheet(){ overlay.classList.remove("show"); }
      overlay.addEventListener("click", function(e){ if(e.target === overlay) closeSheet(); });
      document.addEventListener("keydown", function(e){ if(e.key === "Escape" && overlay.classList.contains("show")) closeSheet(); });

      /* ---------- Interactions（表示切り替えのみ） ---------- */
      document.addEventListener("click", function(e){
        var body = e.target.closest ? e.target.closest('[data-act="detail"]') : null;
        if(body){
          var row = e.target.closest(".g-row");
          var t = row && findTask(row.getAttribute("data-id"));
          if(t) openDetail(t);
        }
      });
      document.addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        var body = e.target.closest ? e.target.closest('[data-act="detail"]') : null;
        if(body){
          var row = e.target.closest(".g-row");
          var t = row && findTask(row.getAttribute("data-id"));
          if(t) openDetail(t);
        }
      });

      var chipBtns = document.querySelectorAll(".chip[data-cat]");
      for(var k=0;k<chipBtns.length;k++){
        chipBtns[k].addEventListener("click", function(){
          state.cat = this.getAttribute("data-cat");
          state.page = 0;
          render();
        });
      }
      document.getElementById("doneChip").addEventListener("click", function(){
        state.showDone = !state.showDone;
        state.page = 0;
        render();
      });
      document.getElementById("prevBtn").addEventListener("click", function(){
        if(state.page > 0){ state.page--; render(); }
      });
      document.getElementById("nextBtn").addEventListener("click", function(){
        state.page++; render();
      });

      // スワイプでもページ送り（ボタン操作も併用可能）
      var touchX = null, touchY = null;
      document.getElementById("main").addEventListener("touchstart", function(e){
        if(e.touches.length === 1){ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
      }, { passive: true });
      document.getElementById("main").addEventListener("touchend", function(e){
        if(touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        var dy = e.changedTouches[0].clientY - touchY;
        touchX = null;
        if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        if(dx < 0){ var n = document.getElementById("nextBtn"); if(!n.disabled){ state.page++; render(); } }
        else { var p = document.getElementById("prevBtn"); if(!p.disabled){ state.page--; render(); } }
      }, { passive: true });

      var resizeTimer = null, lastWide = isWide();
      window.addEventListener("resize", function(){
        if(resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function(){
          if(isWide() !== lastWide){ lastWide = isWide(); state.page = 0; }
          render();
        }, 150);
      });

      (function(){
        var n = new Date();
        document.getElementById("todayLabel").textContent =
          (n.getMonth()+1)+"月"+n.getDate()+"日（"+WD[n.getDay()]+"）";
        render();
      })();
    </script>
  </body>
</html>
